  - id: ADR-ERP-014
    title: ERP master data ownership, synchronisation and reference data architecture
    status: partial
    evidence:
      - modules/provisioning/master_data.py
      - modules/provisioning/master_data_adapter.py
      - modules/provisioning/master_data_mapping.py
