  - id: ADR-ERP-019
    title: ERP provisioning, tenant and legal-entity onboarding, migration and decommissioning architecture
    status: partial
    evidence:
      - modules/provisioning/lifecycle.py
      - modules/provisioning/model.py
      - modules/provisioning/config.py
      - modules/provisioning/validation.py
      - modules/provisioning/planner.py
      - modules/provisioning/service.py
      - modules/provisioning/store.py
      - modules/provisioning/idempiere_adapter.py
      - modules/provisioning/native_mapping_store.py
      - modules/provisioning/native_processes.py
      - modules/provisioning/request_state.py
      - modules/provisioning/execution.py
      - modules/provisioning/execution_store.py
      - modules/application/provisioning_worker.py
      - db/migrations/0021_provisioning_execution.sql
      - tests/unit/test_provisioning_execution_rules.py
      - tests/integration/test_provisioning_execution.py
      - modules/context/postgres_store.py
      - db/migrations/0007_create_erp_provisioning.sql
      - db/migrations/0008_add_control_plane_mapping_context.sql
      - db/migrations/0009_erp_provisioning_native_mapping.sql
      - config/provisioning/zuribeans-ug.production.template.json
      - config/provisioning/zuribeans-za.production.template.json
      - tests/unit/test_provisioning_lifecycle.py
      - tests/unit/test_provisioning_planner.py
      - tests/unit/test_provisioning_service.py
      - tests/unit/test_provisioning_config.py
      - tests/unit/test_provisioning_validation.py
      - tests/unit/test_idempiere_provisioning_adapter.py
      - migration/
    gap: >
      Desired-state validation, deterministic planning, idempotent step execution,
      persisted audit evidence and readiness reconciliation now exist, and so does
      a concrete ProvisioningAdapter (IdempiereProvisioningAdapter, Gate ZB-02):
      it executes every step the planner emits (CREATE_CLIENT,
      CREATE_ORGANISATION, CONFIGURE_ACCOUNTING, CONFIGURE_LOCALISATION,
      CREATE_WAREHOUSE, PERSIST_MAPPING) against the already-real
      RestIdempiereClient. Retries never guess a native record by Name: every
      create step is keyed by (provisioning_id, resource_key) in a durable
      Postgres-backed store (PostgresNativeProvisioningMappingStore,
      baobab.erp_provisioning_native_mapping), so a retried step reuses the
      native ID a prior attempt already created instead of duplicating it.
      CONFIGURE_ACCOUNTING/CONFIGURE_LOCALISATION fail closed with no invented
      process ID unless the step carries an approved process_id, which the
      executor adds from deployment configuration (native_processes.py) after
      the plan is built, so the plan digest does not depend on the installation.
      PERSIST_MAPPING additionally writes the resulting
      (tenant_id, legal_entity_id) -> (AD_Client_ID, AD_Org_ID) row into
      baobab.tenant_mapping (PostgresTenantMappingStore.create_mapping, via the
      adapter's optional tenant_mappings collaborator) so modules/context can
      actually resolve the new legal entity afterwards -- without this, a
      provisioning operation could mark itself complete while remaining
      unresolvable, which would defeat the point of provisioning. This closes
      the responsibility split this ADR describes: Control Plane owns the
      canonical identifiers; the ERP engine owns Client/Org/accounting
      configuration. The single ZuriBeans production template was replaced by
      two -- zuribeans-ug and zuribeans-za -- reflecting ADR-ERP-021's two-
      AD_Client topology decision; both fail closed on unverified canonical, legal
      and financial values, including effective_date and accounting.approved_at
      (previously unchecked placeholder fields, fixed alongside this work). What's
      still open: the adapter is code-complete against RestIdempiereClient's
      spec-verified transport shape but has never run against a live instance (no
      REST plugin installed, same gap as ADR-ERP-005/013), so its AD_Client/
      AD_Org/M_Warehouse field payloads are drawn from iDempiere's public schema,
      not independently proven correct end-to-end; no approved accounting or
      localisation process IDs exist for either ZuriBeans legal entity yet, so
      CONFIGURE_ACCOUNTING/CONFIGURE_LOCALISATION cannot actually run against a
      real deployment until those are supplied; and a live Control Plane client
      and real migration source system still don't exist.

      UPDATE 2026-10-08 (ERP-CAP-04): an accepted command is now executed.
      application/provisioning_worker.py (the baobab-provisioning-worker Compose
      service) claims each due operation with a session advisory lock and runs it
      through ProvisioningExecutor: the stored desired state is decoded and must
      reproduce the digest it was accepted under (STATE_DRIFT otherwise), the
      engine session and every process id are resolved before the first step so
      nothing is created that cannot be finished, completed steps are skipped on
      resume, and an engine record created just before a crash is adopted by the
      marker its step wrote into Description rather than created again. Failure is
      classified (retry with backoff, blocked until an operator configures a
      credential or process id, failed with a fixed code) and projects onto the
      command state and its provisioning.changed events. Proven against Postgres
      and a fake engine (tests/integration/test_provisioning_execution.py), NOT a
      live iDempiere: AD_Client creation through the REST plugin, Description as
      the marker column, and the process ids are what ERP-CAP-03 must confirm.
      Still open: the new AD_Client's own integration credentials
      (IDEMPIERE_CLIENT_CREDENTIALS_JSON) are set by hand afterwards; the
      provisioner identity is a deployment secret whose least-privilege role is
      not yet defined; CREATE_ORGANISATION is never planned.

  - id: ADR-ERP-020
    title: ERP production readiness, governance and architecture conformance
    status: partial
    evidence:
      - architecture/conformance.yaml
      - docs/migration/00-target-architecture.md
      - docs/migration/01-capability-ownership-matrix.md
      - modules/provisioning/activation.py
      - docs/zuribeans-activation-runbook.md
      - tests/golden/harness.py
      - tests/golden/README.md
      - tests/golden/test_activation.py
      - tests/golden/test_zuribeans_release1.py
      - scripts/validate.sh
      - scripts/provider_publication.py
      - tests/conformance/test_provider_publication.py
      - docs/operations/provider-support-publication.md
    gap: >
      Gate ZB-06 adds the machine-readable readiness gate section 9 describes:
      ActivationEvaluator.evaluate() takes a single LegalEntity's Evidence set and
      returns ready only when every one of the ten mandatory checks (CP assignment,
      native provisioning, localisation, warehouses, master data, the four golden
      paths, and reconciliation) is present with status PASS -- missing or failing
      evidence is reported as a named blocker, never silently treated as passing.
      Two real gaps in the supplied evidence model were fixed: a PASS Evidence with
      an empty reference (no audit trail pointing at what proves the check passed)
      was previously accepted, which would let "ready" mean nothing more than a
      status flag; Evidence now rejects that at construction. Duplicate evidence
      submitted twice for the same check was previously resolved by silently
      keeping whichever happened to be last in the sequence (which could silently
      shadow a real FAIL with a stale PASS); evaluate() now rejects it outright.
      evaluate() is always called per LegalEntity, matching section 220
      ("independent activation" -- Zuribeans_ZA's readiness never forces or blocks
      Zuribeans_UG's). GoldenHarness's trade/erp/reconciliation collaborators are
      now typed against explicit Protocols (TradeGoldenClient/ErpGoldenClient/
      ReconciliationClient) instead of bare `object`, documenting the exact
      interface a real integration would need to implement. tests/golden/
      test_zuribeans_release1.py -- previously pytest-fixture-based code this
      repo's actual `python -m unittest discover` CI runner would never collect,
      the same dead-test anti-pattern found repeatedly in Gates ZB-01/03/04/05 --
      is rewritten so it's correctly discovered and skips with an honest reason
      rather than silently vanishing; and scripts/validate.sh, which never ran
      tests/golden at all, now does, so this gate's real unit-level evidence
      (test_activation.py) actually executes in CI rather than being present in
      the repo but never run -- the same class of gap, one level up the stack.
      What's still open, honestly, and by design (see the activation runbook and
      tests/golden/README.md): no concrete TradeGoldenClient/ErpGoldenClient/
      ReconciliationClient implementation exists, so the golden paths themselves
      cannot execute in this environment, which has no live iDempiere instance to
      provision one against (same REST-plugin-install gap as ADR-ERP-005/013) --
      golden tests must run against a real provisioned test iDempiere instance and
      are deliberately never replaced with mocks for release evidence. Production
      readiness for ZuriBeans itself has therefore not been demonstrated; this
      gate provides the mechanism that will evaluate it once real evidence exists.

      UPDATE 2026-10-08 (ERP-CAP-07): the capability-provider declaration (.baobab/capability-provider.yaml) is now
      checked at the pinned Shared commit on every pull request. scripts/provider_publication.py (and
      tests/conformance/test_provider_publication.py, run by the shared-conformance job) validates the catalogue and
      the declaration, generates canonical DRAFT EngineRegistration documents through Shared's own generator for
      IMPLEMENTED support only (today inventory.availability.query; finance.order-consequence.process is PARTIAL and is
      excluded), and detects drift against a reviewed registration export. It is read-only and offline: it does NOT
      contact the Control Plane, so Control Plane registration, certification (EA-09), tenant bindings and health remain
      unproven and are owned by the Control Plane; they need runtime evidence, not this declaration.


  - id: ADR-ERP-021
    title: ZuriBeans multi-market AD_Client topology
    status: partial
    evidence:
      - docs/adr/ADR-ERP-021 — ZuriBeans Multi-Market AD_Client Topology.md
      - config/provisioning/zuribeans-ug.production.template.json
      - config/provisioning/zuribeans-za.production.template.json
      - modules/provisioning/idempiere_adapter.py
      - tests/unit/test_provisioning_idempiere_adapter.py
    gap: >
      Status: Proposed (formal acceptance is a team action, not something implied
      by this ledger). Records the decision ZuriBeans' two operating markets
      (Uganda, South Africa) needed and that ADR-ERP-002/008 explicitly forbid
      defaulting: two separate AD_Clients (ZURIBEANS_UG, ZURIBEANS_ZA), each its
      own LegalEntity, both on the shared ERP-AF-SOUTH-01 EngineInstance alongside
      NABHOLD/THAMANI. The two provisioning templates and the provisioning
      adapter's CREATE_CLIENT/PERSIST_MAPPING steps are real code built against
      this decision. What's still open: real Control-Plane-issued UUIDs and
      Finance-approved accounting configuration for both legal entities (explicit
      REQUIRED_* placeholders -- pending a live nabhold/baobab-cp deployment and
      actual Finance sign-off, not fabricatable here); the UG<->ZA intercompany
      consequence this decision creates (governed by ADR-ERP-008 sections 92-97)
      is documented but not built; and none of it has run against a live
      iDempiere instance (same REST-plugin-install gap as ADR-ERP-005/013).
