    gap: >
      Gate ZB-04's canonical master-data bootstrap: CanonicalMasterRecord carries
      canonical_id, external_key and legal_entity_id as distinct fields (INV-ERP-MD-008,
      "Product is not equivalent to M_Product") and IdempiereMasterDataBootstrapper
      reconciles desired state against the native record by a content digest,
      creating/reusing/updating rather than guessing by name (INV-ERP-MD-023/043,
      idempotent projection updates). It also rejects an incoming record whose
      source_version is not newer than what's already mapped instead of silently
      overwriting with a possibly-replayed/out-of-order update (INV-ERP-MD-027,
      "consumers do not overwrite newer source versions with stale updates") --
      reported as drift for reconciliation rather than applied. product_accounting
