  - id: ADR-ERP-004
    title: Baobab iDempiere extension architecture
    status: foundation
    evidence:
      - idempiere/extensions/org.nabhold.baobab.erp.context/
      - idempiere/extensions/org.nabhold.baobab.erp.mapping/
      - idempiere/extensions/org.nabhold.baobab.erp.integration/
      - idempiere/extensions/org.nabhold.baobab.erp.events/
      - idempiere/extensions/org.nabhold.baobab.erp.outbox/
      - idempiere/patches/README.md
    gap: >
      5 of the 8 reserved namespaces have a bundle; the rest are unimplemented by
      design until there is a real extension point to fill. `integration` is a
      library bundle (no Activator, no published OSGi service) that `context`,
      `mapping` and `outbox` all depend on for reaching baobab-app over HTTP -- a
      real, inter-bundle OSGi dependency (Import/Export-Package), not just shared
      source. `events` goes further: it's the first bundle that consumes other
      bundles' OSGi *services* (context's ContextResolver, mapping's
      CanonicalMappingResolver and, as of `outbox`, OutboxPublisher, each via a
      ServiceTracker) rather than just sharing a library, and it registers a plain
      org.osgi.service.event.EventHandler for iDempiere's own asynchronous
      adempiere/po/postCreate and postUpdate topics -- a real, working example of
      the "event handler" extension mechanism named throughout this ADR, requiring
      no iDempiere Maven artifact at compile time (see idempiere/README.md). On a
      resolved event, that handler now publishes a generic erp.*.synced.v1 fact via
      OutboxPublisher (HTTP POST to baobab-app's /outbox/record, fire-after-commit
      per INV-ERP-EXT-011, failures logged and swallowed rather than rethrown) --
      the first time this repository's transactional-outbox pattern
      (modules/outbox/, ADR-ERP-006) has been fed a real event from inside
      iDempiere, rather than only ever being exercised with synthetic test data.
      A first *command*-side bundle (invoking native iDempiere processes for
      document completion/posting, e.g. Sales Order or Customer Invoice) was
      planned but, on closer inspection, isn't buildable this way in this
      environment either: it would need org.compiere.model classes this
      environment has no Maven artifacts for at compile time, the same constraint
      that already shapes `context`/`mapping`/`events`'s own reflection-based
      design -- see modules/order_to_cash/ (ADR-ERP-016's evidence) for where that
      command logic actually lives instead, outside iDempiere's JVM, against the
      already-real RestIdempiereClient.

  - id: ADR-ERP-005
    title: Baobab ERP integration API architecture
    status: partial
    evidence:
      - modules/integration/idempiere_client.py
      - modules/integration/delivery_transport.py
      - modules/application/server.py
      - tests/unit/test_idempiere_client.py
      - tests/integration/test_http_server.py
      - idempiere/Dockerfile
      - idempiere/rest-api/README.md
      - idempiere/vendor/rest-api-p2/
    gap: >
      The inbound HTTP server exists and is tested end-to-end (health checks, signed
      webhook receipt). RestIdempiereClient is now a real implementation (one-step JWT
      login, automatic token refresh, get/create/update against /models/{table}),
      verified against the com.trekglobal.idempiere.rest.api / bxservice/idempiere-rest
      OpenAPI spec and tested against a fake server reproducing that spec exactly --
      but not yet against a real running iDempiere instance. idempiere/Dockerfile now
      has a real, verified install step (iDempiere's own update-prd.sh, confirmed
      present in the pinned image by downloading and inspecting the actual release
      archive, not assumed) gated on a p2 repository being present at
      idempiere/vendor/rest-api-p2/ -- but that directory is empty by default, because
      producing com.trekglobal.idempiere.rest.api's p2 repository needs a Tycho build
      against a p2 repository of iDempiere's own core, which needs network access
      (a p2 mirror, or a full source build of iDempiere core) this environment doesn't
      have; see idempiere/rest-api/README.md for exactly what was checked and what
      remains. Until someone supplies that repository, no canonical operation can
      actually reach a live iDempiere; that remains the most consequential gap in this
      ADR, though the installation half of it is no longer unverified guesswork.
      Separately, the HTTP surface this ADR governs (modules/application/server.py)
      is not yet the boundary API nabhold/shared publishes at contracts/erp/v1/openapi.yaml
      -- see contracts.lock.yaml and docs/reconciliation-plan.md (Phase 3) for the
      gap and what blocks closing it (no HTTP framework chosen yet, no auth).

  - id: ADR-ERP-006
    title: ERP canonical event architecture
    status: foundation
    evidence:
      - modules/events/envelope.py
      - modules/outbox/postgres_store.py
      - modules/inbox/postgres_store.py
      - modules/application/server.py
      - modules/application/dispatch_worker.py
      - modules/scripts/dispatch_worker_loop.sh
      - modules/integration/delivery_transport.py
      - db/migrations/0004_create_event_outbox.sql
      - db/migrations/0005_create_event_inbox.sql
      - contracts/events/
      - compose.yaml
      - tests/integration/test_postgres_outbox_store.py
      - tests/integration/test_postgres_inbox_store.py
      - tests/integration/test_http_server.py
    gap: >
      Record -> dispatch -> signed HTTP delivery -> mark-delivered, and
      receive -> verify -> deduplicate -> persist, are both proven end-to-end
      against a real Postgres database and real HTTP server (not just in-memory
      fakes). dispatch_worker.py still runs to completion and exits by design
      rather than being a long-running daemon, but that gap is now closed: the
      baobab-dispatch-worker Compose service invokes it periodically via
      modules/scripts/dispatch_worker_loop.sh (a plain, configurable sleep loop --
      scheduling policy as deployment configuration, matching the worker's own
      design intent, not a change to the worker itself). What's still open: the
      loop is a shell sleep loop, not a real scheduler daemon (cron, a systemd
      timer) -- fine for the single-host Compose topology this repository
      supports today, but worth revisiting if/when ADR-ERP-013 moves past it; and
      there's no retry/backoff between ticks beyond dispatch_worker.py's own
      per-event backoff, so a failed tick just waits for the next fixed-interval
      attempt. Separately: EventEnvelope (modules/events/envelope.py) and
      contracts/events/envelope.schema.json are baobab-erp's own bespoke shape,
      not nabhold/shared's published CloudEvents 1.0 envelope
      (contracts/events/v1/envelope.schema.json) -- nabhold/shared itself now
      archives this repo's shape as the legacy fixture
      contracts/events/v1/compatibility/legacy-trade-erp-event.json. See
      contracts.lock.yaml and docs/reconciliation-plan.md (Phase 1) for the exact
      field-level drift and why migrating the wrapper alone, ahead of Phase 2's
      canonical-id work, isn't done yet. baobab-trade has not integrated
      contracts/erp/v1 either, so this is readiness work, not an active break.

  - id: ADR-ERP-007
    title: ERP canonical entity and external reference mapping architecture
    status: partial
    evidence:
      - db/migrations/0003_create_entity_mapping.sql
      - modules/mapping/postgres_store.py
      - tests/integration/test_postgres_mapping_store.py
      - tests/integration/test_http_server.py
      - idempiere/extensions/org.nabhold.baobab.erp.mapping/
      - idempiere/extensions/org.nabhold.baobab.erp.integration/
      - idempiere/extensions/org.nabhold.baobab.erp.events/
    gap: >
      modules/mapping resolves canonical <-> native references against a real
      Postgres-backed store, exposed over HTTP at GET /mapping/resolve and
      /mapping/resolve-canonical. BaobabMappingResolver (the OSGi bundle) now calls
      those for real, tested against a real local HTTP server. The extension-point
      gap that used to sit here is now closed for section 170's near-term slice
      (Party/Product/PurchaseOrder-SalesOrder/Supplier-CustomerInvoice, per that
      section's own Definition-of-Done checklist): the `events` bundle registers a
      real org.osgi.service.event.EventHandler for iDempiere's own asynchronous
      adempiere/po/postCreate/postUpdate topics, filtered to C_BPartner, M_Product,
      C_Order and C_Invoice. On every such event it first derives the owning tenant
      from the changed record's own AD_Client_ID/AD_Org_ID via
      ContextResolver.resolveTenant (see ADR-ERP-002's evidence), then calls
      CanonicalMappingResolver.resolveToCanonical for that tenant -- a real
      iDempiere request now invokes both registered services, correctly, even when
      one iDempiere instance hosts several tenants at once (ADR-ERP-003's default
      topology), which an earlier version of this bundle got wrong (a single
      process-wide tenant system property, caught in review before merge). What's
      still open: C_Payment, M_InOut and M_Warehouse are in section 170's full
      mapping matrix but not yet in its checklist or wired here -- adding one is a
      one-line filter change in EventsActivator, not new code, since the handler
      reads "tableName" generically. Separately: baobab.entity_mapping's own shape
      (bare-UUID canonical_id, 2-value status enum, no legal_entity_id or temporal
      fields) has drifted from nabhold/shared's published
      contracts/erp/v1/mapping.schema.json -- see contracts.lock.yaml and
      docs/reconciliation-plan.md (Phase 2), which is itself blocked on this repo
      not yet having a Control Plane integration to source legal_entity_id from.

  - id: ADR-ERP-008
    title: ERP financial, accounting and multi-currency architecture
    status: partial
    evidence:
      - modules/order_to_cash/model.py
      - modules/order_to_cash/service.py
      - modules/provisioning/idempiere_adapter.py
      - config/provisioning/zuribeans-ug.production.template.json
      - config/provisioning/zuribeans-za.production.template.json
      - tests/unit/test_order_to_cash_service.py
      - tests/integration/test_order_to_cash_http.py
      - tests/unit/test_provisioning_idempiere_adapter.py
      - docs/adr/ADR-ERP-021 — ZuriBeans Multi-Market AD_Client Topology.md
    gap: >
      LegalEntity accounting configuration now has a real code path: the
      provisioning adapter's CONFIGURE_ACCOUNTING step creates a C_AcctSchema
      record from the request's functional currency and costing method, and
      order_to_cash.service implements the sell-side document lifecycle (Sales
      Order -> Shipment -> Customer Invoice -> Payment -> Allocation) calling
      RestIdempiereClient.execute_process for every completion/posting/allocation
      step, never a direct field patch (INV-ERP-EXT-009/010) -- one functional
      currency per AccountingSchema per LegalEntity, per section 14. ADR-ERP-021
      records a real, previously-undecided topology choice this ADR required
      (ZuriBeans Uganda and South Africa are two separate AD_Clients, each its own
      LegalEntity/AccountingSchema, not one shared AD_Client) and its consequence
      under this ADR's sections 92-97: no cross-client SQL, each entity represents
      the other as its own C_BPartner for intercompany. What's still open: none of
      this has run against a live iDempiere instance (same REST-plugin-install gap
      as ADR-ERP-005/013); chart-of-accounts template, tax profile and Finance
      sign-off for both ZuriBeans legal entities remain explicit REQUIRED_*
      placeholders in the provisioning templates, pending a live Control Plane and
      actual Finance approval; and the UG<->ZA intercompany elimination itself
      (sections 92-97) is not built -- flagged as follow-up scope in ADR-ERP-021,
      not silently dropped.

