  - id: ADR-ERP-004
    title: Baobab iDempiere extension architecture
    status: foundation
    evidence:
      - idempiere/extensions/org.nabhold.baobab.erp.context/
      - idempiere/extensions/org.nabhold.baobab.erp.mapping/
      - idempiere/extensions/org.nabhold.baobab.erp.integration/
      - idempiere/extensions/org.nabhold.baobab.erp.events/
      - idempiere/extensions/org.nabhold.baobab.erp.outbox/
      - idempiere/patches/README.md
    gap: >
      5 of the 8 reserved namespaces have a bundle; the rest are unimplemented by
      design until there is a real extension point to fill. `integration` is a
      library bundle (no Activator, no published OSGi service) that `context`,
      `mapping` and `outbox` all depend on for reaching baobab-app over HTTP -- a
      real, inter-bundle OSGi dependency (Import/Export-Package), not just shared
      source. `events` goes further: it's the first bundle that consumes other
      bundles' OSGi *services* (context's ContextResolver, mapping's
      CanonicalMappingResolver and, as of `outbox`, OutboxPublisher, each via a
      ServiceTracker) rather than just sharing a library, and it registers a plain
      org.osgi.service.event.EventHandler for iDempiere's own asynchronous
      adempiere/po/postCreate and postUpdate topics -- a real, working example of
      the "event handler" extension mechanism named throughout this ADR, requiring
      no iDempiere Maven artifact at compile time (see idempiere/README.md). On a
      resolved event, that handler now publishes a generic erp.*.synced.v1 fact via
      OutboxPublisher (HTTP POST to baobab-app's /outbox/record, fire-after-commit
      per INV-ERP-EXT-011, failures logged and swallowed rather than rethrown) --
      the first time this repository's transactional-outbox pattern
      (modules/outbox/, ADR-ERP-006) has been fed a real event from inside
      iDempiere, rather than only ever being exercised with synthetic test data.
      A first *command*-side bundle (invoking native iDempiere processes for
      document completion/posting, e.g. Sales Order or Customer Invoice) was
      planned but, on closer inspection, isn't buildable this way in this
      environment either: it would need org.compiere.model classes this
      environment has no Maven artifacts for at compile time, the same constraint
      that already shapes `context`/`mapping`/`events`'s own reflection-based
      design -- see modules/order_to_cash/ (ADR-ERP-016's evidence) for where that
      command logic actually lives instead, outside iDempiere's JVM, against the
      already-real RestIdempiereClient.

  - id: ADR-ERP-005
    title: Baobab ERP integration API architecture
    status: partial
    evidence:
      - modules/integration/idempiere_client.py
      - modules/integration/delivery_transport.py
      - modules/application/server.py
      - modules/application/boundary.py
      - modules/application/problem.py
      - tests/integration/test_boundary_api.py
      - tests/integration/test_legacy_problem_details.py
      - tests/integration/_problem.py
      - tests/conformance/test_http_contract.py
      - tests/unit/test_idempiere_client.py
      - tests/integration/test_http_server.py
      - idempiere/Dockerfile
      - idempiere/rest-api/README.md
      - idempiere/vendor/rest-api-p2/
    gap: >
      The inbound HTTP server exists and is tested end-to-end (health checks, signed
      webhook receipt). RestIdempiereClient is now a real implementation (one-step JWT
      login, automatic token refresh, get/create/update against /models/{table}),
      verified against the com.trekglobal.idempiere.rest.api / bxservice/idempiere-rest
      OpenAPI spec and tested against a fake server reproducing that spec exactly --
      but not yet against a real running iDempiere instance. idempiere/Dockerfile now
      has a real, verified install step (iDempiere's own update-prd.sh, confirmed
      present in the pinned image by downloading and inspecting the actual release
      archive, not assumed) gated on a p2 repository being present at
      idempiere/vendor/rest-api-p2/ -- but that directory is empty by default, because
      producing com.trekglobal.idempiere.rest.api's p2 repository needs a Tycho build
      against a p2 repository of iDempiere's own core, which needs network access
      (a p2 mirror, or a full source build of iDempiere core) this environment doesn't
      have; see idempiere/rest-api/README.md for exactly what was checked and what
      remains. Until someone supplies that repository, no canonical operation can
      actually reach a live iDempiere; that remains the most consequential gap in this
      ADR, though the installation half of it is no longer unverified guesswork.
      Separately, the HTTP surface this ADR governs (modules/application/server.py)
      is not yet the boundary API nabhold/shared publishes at contracts/erp/v1/openapi.yaml
      -- see contracts.lock.yaml and docs/reconciliation-plan.md (Phase 3) for the
      gap and what blocks closing it (no HTTP framework chosen yet, no auth).

      ERP-COMPAT-03a (contracts/erp/v1/openapi.yaml, Shared 739f0ca): GET /mappings/{mapping_id}
      and GET /mappings are served (with or without the /v1 base path) from
      baobab.entity_mapping, authenticated and scoped (erp:read), tenant taken only from the
      token's tenant_id claim (a request value never widens it; another tenant's mapping is
      404), vendor bindings never returned, errors as application/problem+json with the
      correlation id echoed. Declared but NOT implemented, answered 501 problem+json after
      authorisation rather than fabricated: POST /provisioning-operations (needs a
      Control Plane assignment source and a governed finance baseline, and a boundary-minted
      op_ operation id on baobab.erp_provisioning_operation), GET
      /provisioning-operations/{operation_id} (same op_ id), GET
      /order-consequences/{commerce_order_id} (no consequence read model), GET
      /inventory-availability (no iDempiere stock query). Dependencies outside this repo: the
      erp:read and erp:provision scopes and a tenant_id claim on ERP-bound tokens are not
      granted by Baobab IAM today (only erp:integrate), so these routes fail closed until the
      owner grants them.

      CORRECTION 2026-10-08 (supersedes the 501 list above): all four operations are now served. Code
      evidence, per axis. Implementation: POST/GET /provisioning-operations, GET /order-consequences/{id}
      (#52) and GET /inventory-availability (#53) have handlers and tests in this repository. Live-provider
      conformance: NONE of the engine-backed routes has run against a live iDempiere (inventory reads
      unconfirmed AD column names; order execution runs against a simulated REST server). Certification:
      not started (EA-09). Implementation is therefore not a statement about the other two.

      ERP-COMPAT-04: every error from the pre-contract routes (context, mapping, outbox, order-to-cash,
      inbound events, readiness) is now RFC 9457 application/problem+json with the correlation id echoed
      (a valid X-Correlation-ID is kept, otherwise one is generated) and trace_id from traceparent;
      legacy documents are flat because the iDempiere-side client parses flat JSON only (BaobabAppClient
      reads detail, then title, then the old error member). Unexpected failures answer a 500 problem, never
      the stdlib HTML page; 401 never echoes validator text, readiness 503 never echoes driver errors.
      A missing context/resolve parameter is now 400 (was 404). Proven by negative cases in
      test_legacy_problem_details.py against a structural check of the Shared schema; exact-pin schema
      validation is ERP-COMPAT-06.

      ERP-COMPAT-06/07: tests/conformance/ (CI job shared-conformance) validates the live Boundary API responses and
      problem documents against the OpenAPI and problem-details schemas at exactly the commit contracts.lock.yaml pins.
      The pin is baobab-platform/shared 92accac (erp/v1 OpenAPI 1.0.1), which declares 400 on the two mapping reads and
      a reusable 501 Not Implemented on the four operations whose backing capability is absent from this engine release.
      The suite is strict: any status ERP returns that the pinned OpenAPI does not declare fails, and the 501s are
      transitional (501 = capability absent, not production readiness; an engine release claiming a capability and
      answering 501 stays uncertified).

  - id: ADR-ERP-006
    title: ERP canonical event architecture
    status: foundation
    evidence:
      - modules/events/cloudevent.py
      - modules/events/registry.py
      - modules/events/envelope.py
      - modules/outbox/postgres_store.py
      - modules/inbox/postgres_store.py
      - modules/application/server.py
      - modules/application/dispatch_worker.py
      - modules/scripts/dispatch_worker_loop.sh
      - modules/integration/delivery_transport.py
      - db/migrations/0004_create_event_outbox.sql
      - db/migrations/0005_create_event_inbox.sql
      - db/migrations/0013_event_cloudevents.sql
      - tests/unit/test_cloudevent.py
      - tests/conformance/test_events.py
      - tests/conformance/test_identifiers.py
      - tests/conformance/test_pin.py
      - compose.yaml
      - tests/integration/test_postgres_outbox_store.py
      - tests/integration/test_postgres_inbox_store.py
      - tests/integration/test_http_server.py
      - modules/inbox/execution_support.py
      - modules/customers/payload.py
      - modules/customers/projection_execution.py
      - tests/unit/test_customer_projection_payload.py
      - tests/integration/test_customer_projection_execution.py
    gap: >
      Record -> dispatch -> signed HTTP delivery -> mark-delivered, and
      receive -> verify -> deduplicate -> persist, are both proven end-to-end
      against a real Postgres database and real HTTP server (not just in-memory
      fakes). dispatch_worker.py still runs to completion and exits by design
      rather than being a long-running daemon, but that gap is now closed: the
      baobab-dispatch-worker Compose service invokes it periodically via
      modules/scripts/dispatch_worker_loop.sh (a plain, configurable sleep loop --
      scheduling policy as deployment configuration, matching the worker's own
      design intent, not a change to the worker itself). What's still open: the
      loop is a shell sleep loop, not a real scheduler daemon (cron, a systemd
      timer) -- fine for the single-host Compose topology this repository
      supports today, but worth revisiting if/when ADR-ERP-013 moves past it; and
      there's no retry/backoff between ticks beyond dispatch_worker.py's own
      per-event backoff, so a failed tick just waits for the next fixed-interval
      attempt. ERP-COMPAT-05: events now travel in Shared's CloudEvents 1.0 envelope
      (modules/events/cloudevent.py): outbox and inbox store every envelope member (migration 0013),
      the inbox deduplicates on (source, id), only registered baobab-erp types can be recorded
      (record_event) and only registered Trade types with their registered dataschema and producer are
      accepted (a legacy-shaped body is a 400). What is still open: ERP's own domain recorders
      (order-to-cash, /outbox/record, the OSGi publisher) emit legacy-shaped events carrying iDempiere
      native ids, for which no registered canonical event or payload exists; they are stored as 'held'
      (never delivered, counted by held_count) until an outcome projection maps them to the registered
      erp.* types with canonical payloads (order_version, revisions, totals), which also needs the
      order-consequence read model. No ERP-produced event is delivered until then.

      CORRECTION 2026-10-08: of the eight registered ERP-produced types only erp.order.consequence-changed
      and erp.provisioning.changed have producers; the other six are registry entries only. Consumed:
      trade.order.placed is now EXECUTED by baobab-inbox-worker (#67; migration 0019, replay/crash/concurrency
      tests, no second sales order). trade.customer.projected is executed by the same worker since ERP-CAP-06 (business partner + mapping). The statement that
      no ERP-produced event is delivered is no longer true for those two types. Live-iDempiere status of order
      execution: unproven.

      ERP-COMPAT-06/07: every Shared example event round-trips through CloudEvent, validates against the pinned
      envelope and its registered dataschema, ERP's produced-type index equals Shared's event registry, the
      archived legacy shape is rejected by both, and identifier/envelope grammars are asserted equal to Shared's
      (tests/conformance/).

  - id: ADR-ERP-007
    title: ERP canonical entity and external reference mapping architecture
    status: partial
    evidence:
      - db/migrations/0003_create_entity_mapping.sql
      - modules/mapping/postgres_store.py
      - tests/integration/test_postgres_mapping_store.py
      - tests/integration/test_http_server.py
      - idempiere/extensions/org.nabhold.baobab.erp.mapping/
      - idempiere/extensions/org.nabhold.baobab.erp.integration/
      - idempiere/extensions/org.nabhold.baobab.erp.events/
    gap: >
      modules/mapping resolves canonical <-> native references against a real
      Postgres-backed store, exposed over HTTP at GET /mapping/resolve and
      /mapping/resolve-canonical. BaobabMappingResolver (the OSGi bundle) now calls
      those for real, tested against a real local HTTP server. The extension-point
      gap that used to sit here is now closed for section 170's near-term slice
      (Party/Product/PurchaseOrder-SalesOrder/Supplier-CustomerInvoice, per that
      section's own Definition-of-Done checklist): the `events` bundle registers a
      real org.osgi.service.event.EventHandler for iDempiere's own asynchronous
      adempiere/po/postCreate/postUpdate topics, filtered to C_BPartner, M_Product,
      C_Order and C_Invoice. On every such event it first derives the owning tenant
      from the changed record's own AD_Client_ID/AD_Org_ID via
      ContextResolver.resolveTenant (see ADR-ERP-002's evidence), then calls
      CanonicalMappingResolver.resolveToCanonical for that tenant -- a real
      iDempiere request now invokes both registered services, correctly, even when
      one iDempiere instance hosts several tenants at once (ADR-ERP-003's default
      topology), which an earlier version of this bundle got wrong (a single
      process-wide tenant system property, caught in review before merge). What's
      still open: C_Payment, M_InOut and M_Warehouse are in section 170's full
      mapping matrix but not yet in its checklist or wired here -- adding one is a
      one-line filter change in EventsActivator, not new code, since the handler
      reads "tableName" generically. Separately: baobab.entity_mapping's own shape
      (bare-UUID canonical_id, 2-value status enum, no legal_entity_id or temporal
      fields) has drifted from nabhold/shared's published
      contracts/erp/v1/mapping.schema.json -- see contracts.lock.yaml and
      docs/reconciliation-plan.md (Phase 2), which is itself blocked on this repo
      not yet having a Control Plane integration to source legal_entity_id from.

  - id: ADR-ERP-008
    title: ERP financial, accounting and multi-currency architecture
    status: partial
    evidence:
      - modules/order_to_cash/model.py
      - modules/order_to_cash/service.py
      - modules/provisioning/idempiere_adapter.py
      - config/provisioning/zuribeans-ug.production.template.json
      - config/provisioning/zuribeans-za.production.template.json
      - tests/unit/test_order_to_cash_service.py
      - tests/integration/test_order_to_cash_http.py
      - tests/unit/test_provisioning_idempiere_adapter.py
      - docs/adr/ADR-ERP-021 — ZuriBeans Multi-Market AD_Client Topology.md
      - modules/integration/trade_projection.py
      - modules/integration/trade_projection_adapter.py
      - modules/integration/trade_projection_mapping.py
      - db/migrations/0011_erp_transaction_projection_mapping.sql
      - tests/unit/test_trade_projection.py
      - tests/integration/test_postgres_trade_projection_mapping_store.py
    gap: >
      Gate ZB-05 adds a second, more general immutability mechanism alongside
      order_to_cash.service's specific sell-side flow: IdempiereTradeProjectionAdapter
      projects a Trade-owned commercial fact (procurement/sales order, goods
      receipt/shipment, AP/AR invoice, AP/AR payment) into its native C_Order/
      M_InOut/C_Invoice/C_Payment header record via a content digest that includes
      the counterparty, never lookup-by-name, and raises rather than silently
      mutating the native record once a canonical_transaction_id's digest has
      changed post-creation -- an explicit correction/reversal workflow is required,
      matching this ADR's posted-record immutability intent. Because C_Order/
      M_InOut/C_Payment are shared tables between the sales and purchase side in
      iDempiere's native schema (distinguished by IsSOTrx/IsReceipt, with no
      inherently sales-safe default), the adapter sets that flag explicitly per
      TransactionKind rather than relying on iDempiere's column default -- left
      unset in the originally supplied code, which would have silently created
      every purchase-side document as a sales-side one. What's still open: this
      creates only the document header (no line creation, no CompleteIt/posting/
      payment-allocation process invocation -- order_to_cash.service is still the
      only kind-specific flow that goes that far, for the sell-side only) and is
      not wired into any HTTP endpoint or caller; buy-side procure-to-pay (Gate
      ZB-07/08) remains unbuilt.

      LegalEntity accounting configuration now has a real code path: the
      provisioning adapter's CONFIGURE_ACCOUNTING step creates a C_AcctSchema
      record from the request's functional currency and costing method, and
      order_to_cash.service implements the sell-side document lifecycle (Sales
      Order -> Shipment -> Customer Invoice -> Payment -> Allocation) calling
      RestIdempiereClient.execute_process for every completion/posting/allocation
      step, never a direct field patch (INV-ERP-EXT-009/010) -- one functional
      currency per AccountingSchema per LegalEntity, per section 14. ADR-ERP-021
      records a real, previously-undecided topology choice this ADR required
      (ZuriBeans Uganda and South Africa are two separate AD_Clients, each its own
      LegalEntity/AccountingSchema, not one shared AD_Client) and its consequence
      under this ADR's sections 92-97: no cross-client SQL, each entity represents
      the other as its own C_BPartner for intercompany. What's still open: none of
      this has run against a live iDempiere instance (same REST-plugin-install gap
      as ADR-ERP-005/013); chart-of-accounts template, tax profile and Finance
      sign-off for both ZuriBeans legal entities remain explicit REQUIRED_*
      placeholders in the provisioning templates, pending a live Control Plane and
      actual Finance approval; and the UG<->ZA intercompany elimination itself
      (sections 92-97) is not built -- flagged as follow-up scope in ADR-ERP-021,
      not silently dropped.

  - id: ADR-ERP-009
    title: ERP market localisation, jurisdiction and regulatory architecture
    status: partial
    evidence:
      - modules/provisioning/localisation.py
      - modules/provisioning/localisation_adapter.py
      - config/provisioning/localisation.registry.example.json
      - tests/unit/test_zuribeans_localisation.py
    gap: >
      Gate ZB-03 implements a narrow, working slice of SS18-25's certification
      concept for ZuriBeans specifically: CertifiedLocalisation captures a profile's
      country, version, effective window, approved native process_id and
      certification_reference, and LocalisationRegistry.require() fails closed if
      any of those don't hold for the requested (profile, country, date) --
      wrong country (SS9's market-to-jurisdiction relationship misuse), no
      certification_reference (SS23 "certified" requires Baobab's approval on
      record), outside the effective window, or no approved process_id (never
      invents an iDempiere process). What's still open: this models only the
      certified/active end-state, not the full candidate -> assessing ->
      configured -> testing -> certified -> active lifecycle SS18 describes, and
      certification here is a single reference string, not SS28's fuller evidence
      record (functional/legal/security/accounting/technical review artifacts).
      The example registry (config/provisioning/localisation.registry.example.json)
      has REQUIRED_*-equivalent REPLACE_* placeholders for the actual approved
      process IDs and certification references for both ZuriBeans legal entities --
      genuinely pending Finance/tax certification and a live iDempiere instance to
      get real process IDs from, not fabricatable here. LocalisationProvisioner is
      not yet wired into the planner/IdempiereProvisioningAdapter step flow.

  - id: ADR-ERP-010
    title: ERP security, identity, authorization and tenant-isolation architecture
    status: partial
    evidence:
      - modules/security/signing.py
      - modules/security/workload_auth.py
      - modules/security/jwks.py
      - modules/context/resolver.py
      - modules/context/postgres_store.py
      - modules/identity/service.py
      - modules/application/server.py
      - tests/security/test_workload_auth.py
      - tests/tenancy/test_context_resolver.py
      - tests/integration/test_http_server.py
    gap: >
      Fail-closed context resolution and HMAC signature verification are now proven
      against a real database and a real HTTP round trip (valid signature accepted,
      invalid signature rejected with 401, before the envelope is even parsed), not
      just in-memory fakes. Gate IAM-10 (ADR-0014 §111) closed the real IdP integration
      gap for machine callers: /context/resolve* and /mapping/resolve* now require a
      Baobab IAM-issued workload bearer token (actor_type=workload, aud=baobab-erp,
      verified against Baobab IAM's real JWKS via PyJWT) instead of trusting network
      location alone -- security.workload_auth.verify_workload_token, tested against a
      real generated RSA keypair (tests/security/test_workload_auth.py) and end-to-end
      over real HTTP (tests/integration/test_http_server.py's 401 cases: missing
      token, wrong audience, malformed scheme). ServiceIdentity is no longer only a
      data carrier with nothing constructing it -- verify_workload_token is the first
      real caller. Gate ZB-03.8 closed the authorization gap this block used to record
      here: every /context/resolve* and /mapping/resolve* request now also requires
      its workload token's scope claim to grant the specific scope that endpoint needs
      (_WORKLOAD_REQUIRED_SCOPES in application/server.py), returning 403 -- distinct
      from the 401 an unauthenticated caller gets -- for a validly authenticated
      workload token that simply doesn't carry it (tests/integration/test_http_server.py's
      403 cases). ServiceIdentity.has_role is no longer dead code with nothing calling
      it. All four gated endpoints currently require the same erp:integrate scope
      because only that one scope is granted to any workload client today
      (baobab-iam/config/scopes/erp-integrate.json) -- splitting context resolution
      from mapping resolution into separate scopes is tracked as a follow-on once a
      real need for finer granularity exists, not invented speculatively here. What's
      still open: human ERP login (iDempiere's own WebUI, via its built-in
      org.idempiere.ui.sso.oidc plugin) is configured as an operational runbook
      (docs/sso-configuration.md) rather than anything this repository's own code
      touches, since AD_SSO_PrincipalConfig lives in iDempiere's own schema
      (ADR-ERP-001) -- see nabhold/baobab-iam's
      docs/governance/gate-iam-10-erp-integration-scope.md for the full human-login
      picture, including one explicitly accepted deviation from ADR-0014 §9.

