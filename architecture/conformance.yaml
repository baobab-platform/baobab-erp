    gap: >
      Status: Proposed (formal acceptance is a team action, not something implied
      by this ledger). Records the decision ZuriBeans' two operating markets
      (Uganda, South Africa) needed and that ADR-ERP-002/008 explicitly forbid
      defaulting: two separate AD_Clients (ZURIBEANS_UG, ZURIBEANS_ZA), each its
      own LegalEntity, both on the shared ERP-AF-SOUTH-01 EngineInstance alongside
      NABHOLD/THAMANI. The two provisioning templates and the provisioning
      adapter's CREATE_CLIENT/PERSIST_MAPPING steps are real code built against
      this decision. What's still open: real Control-Plane-issued UUIDs and
