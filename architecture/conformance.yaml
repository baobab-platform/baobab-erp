      accounting process is wired, matching ADR-ERP-008's posted-record immutability
      intent) and are reported as drift. Cross-legal-entity records are rejected
      (Zuribeans_ZA and Zuribeans_UG remain isolated canonical LegalEntities, never
      conflated). What's still open: CanonicalMasterDataSource (the reader of
      authoritative Baobab master data) is only a Protocol here -- no concrete
      implementation reading from Shared/CP/Trade's actual canonical stores exists
      yet, so MasterDataBootstrapService cannot run against real data in this
      environment. There is no HTTP endpoint wiring this into
      modules/application/server.py, and no workload-token authorization is
      enforced at this layer yet (INV-ERP-MD-053/054) -- that belongs at the
      integration boundary once one exists. config/provisioning/
      zuribeans.master-data.example.json's legal_entity_id/engine_instance_id
      fields are still REPLACE_*-placeholder, pending real Control-Plane-issued
      identifiers; the file states explicitly that examples must never seed
      invented production masters.

