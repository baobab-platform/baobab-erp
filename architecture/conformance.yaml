# Honest per-ADR conformance ledger (ADR-ERP-020, Phase 30). This is checked in by hand
# and reviewed alongside every architecturally significant change; it is not generated
# from a coverage tool, so keep entries accurate rather than optimistic.
#
# status:
#   foundation - the decision has real, working code demonstrating the pattern
#   partial    - some of the decision is implemented and tested; a material gap remains
#   planned    - decided in the ADR, not yet implemented
schema_version: "1.0"
updated: "2026-09-16"
adrs:
  - id: ADR-ERP-001
    title: iDempiere as an isolated, headless, multi-tenant Baobab ERP engine
    status: foundation
    evidence:
      - idempiere/Dockerfile
      - compose.yaml
      - idempiere/extensions/
    gap: No production EngineInstance exists; no application-service HTTP layer yet.

  - id: ADR-ERP-002
    title: ERP tenant, client and organization mapping
    status: partial
    evidence:
      - db/migrations/0002_create_tenant_mapping.sql
      - db/migrations/0006_add_tenant_mapping_native_unique_index.sql
      - modules/context/postgres_store.py
      - modules/application/server.py
      - tests/integration/test_postgres_context_store.py
      - tests/integration/test_http_server.py
      - tests/tenancy/test_context_resolver.py
      - idempiere/extensions/org.nabhold.baobab.erp.context/
      - idempiere/extensions/org.nabhold.baobab.erp.integration/
      - idempiere/extensions/org.nabhold.baobab.erp.events/
      - modules/provisioning/cp_contract.py
      - modules/provisioning/legal_entity_policy.py
      - modules/provisioning/authoritative_service.py
      - tests/unit/test_cp_authoritative_assignment.py
    gap: >
      modules/context resolves against a real Postgres-backed store, exposed over
      HTTP at GET /context/resolve. BaobabContextResolver (the OSGi bundle running
      inside iDempiere) now calls that endpoint for real -- tested against a real
      local HTTP server reproducing the exact response shape -- instead of always
      failing closed. The forward direction (tenant -> AD_Client/AD_Org) still has
      no invoking extension point inside iDempiere: it's driven by inbound requests,
      which still depends on the deferred REST API plugin (ADR-ERP-005/ADR-ERP-013).
      The reverse direction (AD_Client/AD_Org -> tenant), added alongside this note
      as ContextResolver.resolveTenant / GET /context/resolve-tenant, backed by a new
      unique index on baobab.tenant_mapping(ad_client_id, ad_org_id) WHERE
      status='active' so it's unambiguous, DOES now have a real invoking extension
      point: the `events` bundle calls it on every real C_BPartner/M_Product/C_Order/
      C_Invoice create/update to derive the correct tenant per record (ADR-ERP-003's default
      topology puts several AD_Clients/tenants on one iDempiere runtime, so a single
      process-wide tenant would be wrong) -- see ADR-ERP-007's evidence below.

      Gate ZB-01 closes a different, previously-open piece of this ADR: SS113/114's
      responsibility split (Control Plane owns canonical identities/topology/isolation;
      ERP consumes rather than infers). CpErpAssignment is the authoritative CP
      projection ERP provisioning now consumes -- it fails closed on expiry, a
      non-production target_environment, duplicate markets, and any required field
      missing (SS76's provisioning preconditions). AuthoritativeProvisioningRequestFactory
      rejects a CP response whose (tenant_id, legal_entity_id) doesn't match what was
      requested (SS97/INV-ERP-MAP-009's "caller cannot override resolved context" applied
      to the CP response itself, not just caller input), and separately rejects any
      native_client_mode other than dedicated_client, because the provisioning adapter
      (idempiere_adapter.py, Gate ZB-02) only ever creates a new AD_Client -- it has no
      "reuse an existing AD_Client" path, so silently accepting existing_client would
      misprovision rather than fail closed. What's still open: no real baobab-cp
      deployment exists to call (ControlPlaneAssignmentSource is a Protocol here,
      exercised only against a fake in tests/unit/test_cp_authoritative_assignment.py);
      FinanceBaseline is still supplied directly to the factory rather than sourced from
      an authoritative Finance system; and native_client_mode itself has only one working
      value end-to-end (dedicated_client) until the adapter gains an existing-client path.

