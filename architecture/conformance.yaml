  - id: ADR-ERP-016
    title: Commerce-ERP integration and order-to-cash architecture
    status: partial
    evidence:
      - modules/order_to_cash/model.py
      - modules/order_to_cash/service.py
      - modules/application/server.py
      - idempiere/extensions/org.nabhold.baobab.erp.outbox/
      - idempiere/extensions/org.nabhold.baobab.erp.events/
      - tests/unit/test_order_to_cash_service.py
      - tests/integration/test_order_to_cash_http.py
    gap: >
      The sell-side order-to-cash sequence (section 17) is implemented and tested
      end-to-end over real HTTP and a real Postgres database, against a fake
      iDempiere REST server standing in for a live instance: create/complete Sales
      Order, create/complete Shipment, create/post Customer Invoice, create/
      complete Payment, allocate Payment -- each completion/posting/allocation
      step invokes a configurable native iDempiere process (never a direct
      DocStatus patch), and each of the five distinct facts section 221 names
      (erp.sales-order.accepted.v1, erp.goods-shipment.completed.v1,
      erp.customer-invoice.posted.v1, erp.payment.completed.v1,
      erp.payment.allocated.v1) is written to the transactional outbox exactly
      once, in order, within the same database transaction as its mapping write
      -- section 222-223's "no echo events" rule is honoured (creation alone
      never emits a fact; only ERP's own completed processing does). Separately,
      the `events` bundle now emits its own generic erp.*.synced.v1 facts for any
      native postCreate/postUpdate (a reconciliation safety net for mutations made
      directly in iDempiere's own UI, distinct from this primary path -- see
      ADR-ERP-004's evidence). What's still open: buy-side procure-to-pay (Gate
      ZB-07/08) is not started; this has never run against a live iDempiere
      instance, only the fake REST server the integration test stands up (the
      same REST-plugin-install gap as ADR-ERP-005/013); and
      modules/application/server.py's new endpoints are baobab-erp's own shape,
      not yet reconciled against nabhold/shared's published
      contracts/erp/v1/openapi.yaml, matching the pre-existing gap
      ADR-ERP-005/006 already record for this HTTP surface.

