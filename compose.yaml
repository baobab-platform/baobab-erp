# iDempiere runtime baseline (Phase 4) plus the Baobab application-service layer
# (modules/). Compose is the supported initial single-host topology; production
# orchestration remains owned by nabhold/infrastructure per ADR-ERP-013. iDempiere
# and baobab-app share one PostgreSQL instance in separate schemas (adempiere,
# baobab); see db/README.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-idempiere}
      POSTGRES_USER: ${DB_USER:-adempiere}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-adempiere} -d ${DB_NAME:-idempiere}"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  idempiere:
    build:
      context: .
      dockerfile: idempiere/Dockerfile
      args:
        IDEMPIERE_IMAGE: ${IDEMPIERE_IMAGE:-idempiereofficial/idempiere:13-release}
    image: ${IDEMPIERE_IMAGE_TAG:-baobab-idempiere:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-idempiere}
      DB_USER: ${DB_USER:-adempiere}
      DB_PASS: ${DB_PASS:?Set DB_PASS}
      DB_ADMIN_PASS: ${DB_ADMIN_PASS:?Set DB_ADMIN_PASS}
    ports:
      - "${IDEMPIERE_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8443/webui/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  baobab-db-migrate:
    build:
      context: .
      dockerfile: modules/Dockerfile
    image: ${BAOBAB_APP_IMAGE_TAG:-baobab-app:local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-adempiere}:${DB_PASS:?Set DB_PASS}@postgres:5432/${DB_NAME:-idempiere}
    entrypoint: ["bash", "/db/migrate.sh"]

  baobab-app:
    build:
      context: .
      dockerfile: modules/Dockerfile
    image: ${BAOBAB_APP_IMAGE_TAG:-baobab-app:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      baobab-db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-adempiere}:${DB_PASS:?Set DB_PASS}@postgres:5432/${DB_NAME:-idempiere}
      BAOBAB_EVENT_SIGNING_SECRET: ${BAOBAB_EVENT_SIGNING_SECRET:?Set BAOBAB_EVENT_SIGNING_SECRET}
      HTTP_PORT: ${BAOBAB_APP_PORT:-8000}
      # Gate IAM-10 (ADR-0014 §111): baobab-app validates every
      # /context/resolve*|/mapping/resolve* caller's bearer token against
      # this issuer's JWKS before trusting network location alone.
      BAOBAB_IAM_OIDC_ISSUER: ${BAOBAB_IAM_OIDC_ISSUER:?Set BAOBAB_IAM_OIDC_ISSUER}
      BAOBAB_IAM_OIDC_AUDIENCE: ${BAOBAB_IAM_OIDC_AUDIENCE:-baobab-erp}
    ports:
      - "${BAOBAB_APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 20

  baobab-dispatch-worker:
    build:
      context: .
      dockerfile: modules/Dockerfile
    image: ${BAOBAB_APP_IMAGE_TAG:-baobab-app:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      baobab-db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-adempiere}:${DB_PASS:?Set DB_PASS}@postgres:5432/${DB_NAME:-idempiere}
      # Each destination is optional, but at least one group must be set, and a group is all-or-nothing.
      # Legacy webhook (every canonical event except provisioning.changed):
      BAOBAB_EVENT_SIGNING_SECRET: ${BAOBAB_EVENT_SIGNING_SECRET:-}
      BAOBAB_WEBHOOK_URL: ${BAOBAB_WEBHOOK_URL:-}
      # Control Plane event ingress (provisioning.changed, signed delivery; the secret is standard base64 of at least 32 bytes):
      BAOBAB_CP_EVENT_INGRESS_URL: ${BAOBAB_CP_EVENT_INGRESS_URL:-}
      BAOBAB_CP_EVENT_KEY_ID: ${BAOBAB_CP_EVENT_KEY_ID:-}
      BAOBAB_CP_EVENT_SECRET_B64: ${BAOBAB_CP_EVENT_SECRET_B64:-}
      BAOBAB_DISPATCH_INTERVAL_SECONDS: ${BAOBAB_DISPATCH_INTERVAL_SECONDS:-60}
    entrypoint: ["bash", "/app/scripts/dispatch_worker_loop.sh"]

volumes:
  postgres-data:
