[project]
name = "baobab-erp-modules"
version = "0.1.0"
description = "Baobab ERP application-service layer: context, mapping, events, and integration boundary in front of iDempiere."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "PyJWT[crypto]>=2.8,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "context",
    "identity",
    "mapping",
    "application",
    "integration",
    "events",
    "outbox",
    "inbox",
    "reconciliation",
    "security",
    "provisioning",
    "order_to_cash",
]
