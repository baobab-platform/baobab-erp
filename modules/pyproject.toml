[project]
name = "baobab-erp-modules"
version = "0.1.0"
description = "Baobab ERP application-service layer: context, mapping, events, and integration boundary in front of iDempiere."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "PyJWT[crypto]>=2.8,<3",
    # The IANA timezone database warehouse timezones are verified against; the slim runtime image has none of its own.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# tests/conformance/: validates ERP's outputs against the pinned baobab-platform/shared contracts.
conformance = [
    "jsonschema[format-nongpl]>=4.21,<5",
    "referencing>=0.35,<1",
    "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "context",
    "identity",
    "mapping",
    "application",
    "integration",
    "events",
    "outbox",
    "inbox",
    "reconciliation",
    "security",
    "provisioning",
    "order_to_cash",
]
