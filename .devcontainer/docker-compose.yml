services:
  workspace:
    image: ghcr.io/baobab-platform/baobab-dev:1.4.3
    command: sleep infinity
    volumes:
      - ..:/workspaces/baobab-erp:cached
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: idempiere
      DB_USER: adempiere
      DB_PASS: dev-only-password
      DATABASE_URL: postgresql://adempiere:dev-only-password@postgres:5432/idempiere
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idempiere
      POSTGRES_USER: adempiere
      POSTGRES_PASSWORD: dev-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adempiere -d idempiere"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
