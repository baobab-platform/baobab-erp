# The baobab-platform/shared contracts baobab-erp implements or consumes
# (EA Plan v2.0 EA-01A; schema: shared .baobab/contract-consumer-lock.schema.json).
# Foundation checks that the commit is on Shared main and that every listed
# contract exists and parses there, and reports drift in the job summary.
# Migrated from the legacy nabhold-contract-consumption-lock pinned at
# nabhold/shared@2da1a42. The pin and contract list are unchanged: moving the
# pin needs its own compatibility PR (see the drift report).
schema: baobab-contract-consumer-lock
version: "1.0"
source:
  repository: baobab-platform/shared
  commit: 2da1a429602d2f1421c498d412bb6c65a5626127
contracts:
  # Source of tenantId (^tn_[a-z0-9]+) and legalEntityId pattern constraints.
  # baobab-erp's own db/migrations tenant_id columns do not yet enforce this
  # pattern.
  - contracts/control-plane/v1/domain.schema.json
  - contracts/erp/v1/asyncapi.yaml
  - contracts/erp/v1/business-partner-projection.schema.json
  - contracts/erp/v1/commerce-order-consequence.schema.json
  - contracts/erp/v1/customer-projection.schema.json
  - contracts/erp/v1/domain.schema.json
  - contracts/erp/v1/inventory-availability.schema.json
  - contracts/erp/v1/invoice-outcome.schema.json
  # Richer than baobab-erp's own db/migrations entity_mapping table today:
  # adds legal_entity_id, mapping_id, a 5-value status enum, and temporal
  # revision fields. Not yet reconciled.
  - contracts/erp/v1/mapping.schema.json
  # Nabhold Baobab ERP Boundary API. baobab-erp's HTTP surface
  # (modules/application/server.py) does not yet implement these paths -- see
  # architecture/conformance.yaml (ADR-ERP-erp-boundary reconciliation) for
  # the phased plan to close that gap.
  - contracts/erp/v1/openapi.yaml
  - contracts/erp/v1/order-consequence-status.schema.json
  - contracts/erp/v1/payment-outcome.schema.json
  - contracts/erp/v1/provisioning-request.schema.json
  - contracts/erp/v1/provisioning-state.schema.json
  # Ownership matrix for 24 concepts. ERP is sole canonical owner for Business
  # Partner, Supplier, Purchase Order, Invoice, Warehouse, Accounting Entry,
  # and Asset only -- no record is implicitly bidirectional.
  - contracts/erp/v1/system-of-record.yaml
  - contracts/erp/v1/warehouse-projection.schema.json
  # RFC 9457 application/problem+json. Not yet the error shape returned by
  # modules/application/server.py.
  - contracts/errors/v1/problem-details.schema.json
  # CloudEvents 1.0 structured JSON profile. baobab-erp's own
  # modules/events/envelope.py and contracts/events/envelope.schema.json
  # predate this and are archived by nabhold/shared itself as the legacy shape
  # (contracts/events/v1/compatibility/legacy-trade-erp-event.json). See
  # docs/reconciliation-plan.md (Phase 1) for the field-level plan and why the
  # wrapper migration is sequenced behind canonical-id work (Phase 2), not
  # done ahead of it -- Trade has not integrated contracts/erp/v1 either, so
  # this is readiness work, not blocking live traffic today.
  - contracts/events/v1/envelope.schema.json
  - contracts/idempotency/v1/policy.yaml
policy:
  updates: explicit_pull_request
  compatibility: validate_before_merge
# Repository-specific metadata, carried over from the legacy lock.
consumer:
  repository: baobab-platform/baobab-erp
  version: "0.1.0"
consumer_policy:
  fail_on_unresolved_tenant_context: true
  allow_cross_engine_database_access: false
  allow_local_redefinition_as_canonical: false
control_plane:
  repository: baobab-platform/baobab-cp
  role: "authoritative runtime provider of authenticated tenant context, market registry and product entitlement"
