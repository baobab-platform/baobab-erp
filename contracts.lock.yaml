# The baobab-platform/shared contracts baobab-erp implements or consumes
# (EA Plan v2.0 EA-01A; schema: shared .baobab/contract-consumer-lock.schema.json).
# Foundation checks that the commit is on Shared main and that every listed
# contract exists and parses there, and reports drift in the job summary.
#
# Pin history: 2da1a42 (legacy nabhold-contract-consumption-lock, migrated unchanged) ->
# 739f0ca (EA-01 ERP-COMPAT-07, 2026-10-02) -> 92accac (erp/v1 OpenAPI 1.0.1: 400 on the mapping reads, 501 on the
# four unavailable operations; Shared#198) -> 6c6bd17 (control-plane/v1 ErpAssignment projection, Shared#200/#201) -> 5eb3c17 (control_plane_authority on the provisioning request; 503 and 400 on the provisioning operations; Shared#202+) -> 1b21a52 (erp/v1 OpenAPI 1.0.4: served operations drop the transitional 501; inventory read declares 400 and 503; Shared#204) -> 0233eb3 (erp/v1 OpenAPI 1.0.5: no operation declares the transitional 501; Shared#205). -> 6899a2d (erp/v1 1.1.0 caller-bound context_id; control-plane/v1 1.33.1 provider-neutral validate; Shared#208/#209) -> 43135a8 (erp/v1 1.1.1: GET /provisioning-operations/{operation_id} requires erp:provision; the audited ERP caller matrix with ERP as the registered baobab-erp validator; Shared#235/#236) -> 05db746 (erp/v1 1.2.0 and control-plane/v1 1.34.0: the TENANT_PROVISIONING context purpose; Shared#241) -> 78b4e5e (erp/v1 1.3.0: the Finance baseline reference and its two reads; finance_baselines required on the provisioning request; Shared#245). The move is proven by tests/conformance/, which runs in CI
# against a checkout of exactly this commit and refuses any other (ERP-COMPAT-06). The semantic delta
# between the two pins is in docs/migration/erp-compat-01-semantic-delta.md.
schema: baobab-contract-consumer-lock
version: "1.0"
source:
  repository: baobab-platform/shared
  commit: 78b4e5ead3b7b2886f7421f2067d962922bebf7e
contracts:
  # Tenant and legal-entity identifier grammars; the access-token claim set whose tenant_id is the
  # mapping reads' tenant authority; the four context-bound operations use validated CP context.
  - contracts/control-plane/v1/access-token-claims.schema.json
  - contracts/control-plane/v1/domain.schema.json
  # Caller-bound validation for ERP API 1.1; mapping reads retain token tenant authority.
  - contracts/control-plane/v1/openapi.yaml
  - contracts/control-plane/v1/platform-context.schema.json
  - contracts/control-plane/v1/market.schema.json
  # The Control Plane's ERP assignment projection ERP provisions from (ADR-ERP-002 SS113/114), its example, and the
  # schemas it references.
  - contracts/control-plane/v1/erp-assignment.schema.json
  - contracts/control-plane/v1/examples/erp-assignment.json
  - contracts/admission/v1/application.schema.json
  - contracts/admission/v1/decision.schema.json
  - contracts/capability/v1/domain.schema.json
  - contracts/organisation/v1/domain.schema.json
  # ERP Boundary API (openapi), its events (asyncapi), payload and mapping schemas, the ownership matrix,
  # capability definitions and the examples the conformance suite replays.
  - contracts/erp/v1/asyncapi.yaml
  - contracts/erp/v1/business-partner-projection.schema.json
  - contracts/erp/v1/capabilities.yaml
  - contracts/erp/v1/commerce-order-consequence.schema.json
  - contracts/erp/v1/customer-projection.schema.json
  - contracts/erp/v1/domain.schema.json
  - contracts/erp/v1/examples/business-partner-changed.json
  - contracts/erp/v1/examples/commerce-order-placed.json
  - contracts/erp/v1/examples/customer-projected.json
  - contracts/erp/v1/examples/inventory-availability-changed.json
  - contracts/erp/v1/examples/invoice-changed.json
  - contracts/erp/v1/examples/order-consequence-changed.json
  - contracts/erp/v1/examples/payment-accounting-changed.json
  - contracts/erp/v1/examples/provisioning-changed.json
  - contracts/erp/v1/examples/warehouse-changed.json
  - contracts/erp/v1/inventory-availability-query.schema.json
  - contracts/erp/v1/inventory-availability.schema.json
  - contracts/erp/v1/invoice-outcome.schema.json
  - contracts/erp/v1/mapping.schema.json
  - contracts/erp/v1/openapi.yaml
  - contracts/erp/v1/order-consequence-status.schema.json
  - contracts/erp/v1/payment-outcome.schema.json
  - contracts/erp/v1/finance-baseline.schema.json
  - contracts/erp/v1/provisioning-request.schema.json
  - contracts/erp/v1/provisioning-state.schema.json
  - contracts/erp/v1/system-of-record.yaml
  - contracts/erp/v1/warehouse-projection.schema.json
  # Buyer-organisation: baobab-erp is the registered producer of customer.buyer-commercial-profile.changed.v1.
  - contracts/buyer-organisation/v1/asyncapi.yaml
  - contracts/buyer-organisation/v1/domain.schema.json
  - contracts/buyer-organisation/v1/events.schema.json
  # RFC 9457 application/problem+json (ERP-COMPAT-04).
  - contracts/errors/v1/problem-details.schema.json
  # CloudEvents 1.0 structured profile, the event registry ERP is checked against, and the archived legacy
  # shape that must stay rejected (ERP-COMPAT-05).
  - contracts/events/v1/compatibility/legacy-trade-erp-event.json
  - contracts/events/v1/envelope.schema.json
  - contracts/events/v1/event-registry.yaml
  # Delivery identity (source, id) and command idempotency.
  - contracts/idempotency/v1/policy.yaml
policy:
  updates: explicit_pull_request
  compatibility: validate_before_merge
# Repository-specific metadata, carried over from the legacy lock.
consumer:
  repository: baobab-platform/baobab-erp
  version: "0.1.0"
consumer_policy:
  fail_on_unresolved_tenant_context: true
  allow_cross_engine_database_access: false
  allow_local_redefinition_as_canonical: false
control_plane:
  repository: baobab-platform/baobab-cp
  role: "authoritative runtime provider of authenticated tenant context, market registry and product entitlement"
