# ERP-A engine-local harness (EA v2.2 EA-R03; ADR-SHARED-037; ADR-ERP-022 §4.3):
# real iDempiere 13 with the shipped Baobab finance veto, the REAL CP binary
# built at a pinned merged commit, real RS256-signed workload tokens from a test
# issuer, and PostgreSQL 17 for both ERP and CP. Every hop ERP makes (CP, IAM)
# is TLS through the `edge`, with a certificate from the run's throwaway CA.
#
# Engine-local real-component evidence on SYNTHETIC data: NOT EA Gate D and NOT
# L4 (EA v2.2 §§3, 7). Integration only: run-gate-d-erp-a.sh refuses any other
# environment. Nothing here is deployable.
name: baobab-gate-d-erp-a

x-pg: &pg
  image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 2s
    retries: 60

networks:
  erpa: {}

services:
  # --- ERP: iDempiere's own PostgreSQL (the image entrypoint imports GardenWorld) and the engine.
  erpdb:
    <<: *pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks: [erpa]
    ports: ["127.0.0.1:55462:5432"]

  erp:
    image: ${ERP_IMAGE}
    depends_on:
      erpdb: {condition: service_healthy}
      edge: {condition: service_started}
    environment:
      DB_HOST: erpdb
      DB_ADMIN_PASS: postgres
      DB_PASS: adempiere
      # The protected (acceptance) runtime: every governed native write needs CP authority.
      JAVA_OPTS: >-
        -Xms256m -Xmx2g -Dbaobab.erp.native.environment=acceptance
        -Dbaobab.cp.native.base.url=https://cp.gated.test/
        -Dbaobab.iam.token.url=https://iam.gated.test/realms/baobab/token
        -Dbaobab.iam.native.client.id=baobab-erp-legal-actor-assessor-staging
        -Dbaobab.iam.native.client.secret=${ERP_WORKLOAD_SECRET}
        -Djavax.net.ssl.trustStore=/gate-d-tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - ${RUN_DIR}/erp-tls:/gate-d-tls:ro
      - ${RUN_DIR}/gate-d:/opt/idempiere/.baobab/gate-d
    networks: [erpa]
    restart: "no"

  # --- CP: its own database and the release binary at the pinned merged commit.
  cpdb:
    <<: *pg
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: ${CPDB_PASSWORD}
    networks: [erpa]
    ports: ["127.0.0.1:55463:5432"]

  cp:
    image: ${CP_IMAGE}
    depends_on: [cpdb, edge]
    environment:
      DATABASE_URL: postgres://controlplane:${CPDB_PASSWORD}@cpdb:5432/controlplane?sslmode=disable
      BAOBAB_ENVIRONMENT: integration
      HTTP_ADDRESS: ":8080"
      # ERP accepts a runtime context living at most 10 minutes (CpNativeFinancialAuthority);
      # CP's 15-minute default is longer, so the deployment sets it explicitly.
      PLATFORM_CONTEXT_TTL: 5m
      WORKLOAD_OIDC_ISSUER: https://iam.gated.test/realms/baobab
      WORKLOAD_OIDC_AUDIENCE: baobab-control-plane
      ADMIN_OIDC_ISSUER: https://iam.gated.test/realms/baobab
      ADMIN_OIDC_AUDIENCE: baobab-control-plane-admin
      ADMIN_OIDC_CLIENT_ID: baobab-control-plane-admin
      WORKLOAD_REGISTRY_FILE: /run/erpa/workload-registry.yaml
      TENANT_BOOTSTRAP_REGISTRATION: enabled
      LEGAL_ACTOR_MANDATE_COMMANDS_ENABLED: "true"
      LEGAL_ACTOR_MANDATE_LIFECYCLE_ENABLED: "true"
      LEGAL_ACTOR_ASSESSMENT_ENABLED: "true"
      PEO_DOCUMENTARY_SCOPE_PDP_ENABLED: "true"
      PEO_DOCUMENTARY_SCOPE_CONSUMERS: baobab-erp-legal-actor-assessor-staging
      ERP_POSTING_AUTHORITY_ENABLED: "true"
      ERP_POSTING_AUTHORITY_CLIENT_IDS: baobab-erp-legal-actor-assessor-staging
      SSL_CERT_FILE: /run/erpa/ca.pem
    volumes: ["${RUN_DIR}/cp:/run/erpa:ro"]
    networks: [erpa]
    ports: ["127.0.0.1:18092:8080"]

  # --- Test IAM and the TLS edge.
  issuer:
    image: ${PYTHON_IMAGE}
    command: ["python", "-u", "/app/issuer.py"]
    environment:
      BAOBAB_ENVIRONMENT: integration
      ISSUER: https://iam.gated.test/realms/baobab
      CLIENTS_FILE: /run/erpa/clients.json
    volumes: ["${RUN_DIR}/issuer:/run/erpa:ro"]
    networks: [erpa]
    ports: ["127.0.0.1:18010:8000"]

  edge:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    depends_on: [issuer]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RUN_DIR}/edge:/etc/nginx/tls:ro
    networks:
      erpa:
        aliases: [cp.gated.test, iam.gated.test]
