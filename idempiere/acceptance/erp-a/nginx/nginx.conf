# ERP-A TLS front door: every hop iDempiere makes (CP, IAM) is TLS with a
# certificate issued by the run's own throwaway CA. The issuer's harness-only
# endpoints are never exposed here.
events {}
http {
    access_log off;
    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.3;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    # Resolve upstreams per request: CP starts after the edge, and is
    # stopped and restarted by the CP-unavailable scenario.
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 443 ssl;
        server_name cp.gated.test;
        location / { set $u http://cp:8080; proxy_pass $u; }
    }
    server {
        listen 443 ssl;
        server_name iam.gated.test;
        location /_ { return 404; }
        location / { set $u http://issuer:8000; proxy_pass $u; }
    }
}
