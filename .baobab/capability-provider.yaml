# Baobab Capability Provider Declaration: baobab-erp
#
# Conforms to:
#   baobab-platform/shared/contracts/capability/v1/provider-declaration.schema.json
# Governing decision:
#   baobab-platform/shared ADR-SHARED-017 (EA-02)
#
# Declares which canonical Baobab capabilities this engine's providers
# implement. It references Shared's catalogue.yaml; it defines no capability.
# It does not state certification (EA-09), activation, bindings, grants,
# engine instances or health: the Control Plane owns those.
#
# Census refreshed 2026-10-07 against baobab-erp main
# 854b1d315e188f6f39295df31618aab31655518e and Shared capability authority
# 40d180756461f3fbbdcf06d1dcd3e1fe6481bed2.
#
# finance.order-consequence.process remains PARTIAL. Canonical trade.order.placed
# ingress is now executed by a separate worker (idempotent, crash-adopting; #67),
# and the consequence read model, canonical query and outcome event are
# implemented. What keeps it PARTIAL: the order lifecycle after placement
# (shipment, invoice and accounting stages) is not driven from canonical
# events, and nothing has run against a live iDempiere.
#
# inventory.availability.query is IMPLEMENTED: Shared now carries the explicit
# request/response contract and catalogue entry, and ERP serves the canonical
# GET boundary from ERP-owned physical stock with mapping, fail-closed and
# contract/integration proof. IMPLEMENTED is the implementation axis only: the
# stock read has not run against a live iDempiere (see
# architecture/conformance.yaml).
#
# See docs/architecture/capability-census-2026-10-07.md.
#
# Validate with a current Shared checkout:
#   python3 <shared>/scripts/capability_catalogue.py validate-declaration \
#     .baobab/capability-provider.yaml --engine-id baobab-erp --repository-root .

schema:
  name: baobab-capability-provider-declaration
  version: "1.0"

engine:
  engine_id: baobab-erp

providers:
  - provider_key: baobab-erp.idempiere
    name: Baobab ERP iDempiere provider
    description: >-
      First-party ERP provider backed by iDempiere. Provider declaration is
      repository implementation evidence only; it is not certification,
      activation, health, binding, grant, routing or production readiness.
    provider_type: BAOBAB_ENGINE
    implementation_key: idempiere
    simulated: false
    production_permitted: true
    invocation:
      service_reference: service://baobab-erp/erp
      protocol: http
    provenance:
      authority:
        repository: baobab-platform/baobab-erp
        decision: ADR-ERP-001
    support:
      - capability_key: finance.order-consequence.process
        contract_versions: [1]
        implementation_status: PARTIAL
        provenance:
          authority:
            repository: baobab-platform/shared
          source_revision: 40d180756461f3fbbdcf06d1dcd3e1fe6481bed2
        implementation_evidence:
          - type: source
            path: modules/events/registry.py
            description: Canonical Trade order event registration and producer/source restrictions.
          - type: source
            path: modules/inbox/service.py
            description: Signed canonical CloudEvent validation and durable idempotent ingress.
          - type: source
            path: modules/order_to_cash/inbox_execution.py
            description: Executes a received trade.order.placed under a per-order lock; finds or adopts the engine order by POReference so a replay or restart cannot create a second sales order.
          - type: source
            path: modules/order_to_cash/execution_policy.py
            description: Outcome codes, bounded retry/backoff and failure classification for order execution.
          - type: source
            path: modules/inbox/postgres_queue.py
            description: Leased FOR UPDATE SKIP LOCKED claim with fenced settle (crash recovery, no double claim).
          - type: source
            path: modules/application/inbox_worker.py
            description: Separate worker entry point (baobab-inbox-worker) that drives the executor.
          - type: source
            path: modules/order_to_cash/service.py
            description: Real sell-side order-to-cash ERP consequence execution.
          - type: source
            path: modules/order_to_cash/consequence.py
            description: Vendor-neutral ERP-owned order-consequence projection rules.
          - type: source
            path: modules/order_to_cash/consequence_events.py
            description: Canonical order.consequence-changed event publication from the consequence projection.
          - type: source
            path: modules/application/boundary.py
            description: Canonical GET order-consequence query boundary with caller-bound Control Plane context authority.
          - type: source
            path: modules/security/platform_context.py
            description: Fail-closed caller-bound Control Plane context validation used by the canonical consequence boundary.
          - type: contract-test
            path: tests/conformance/test_context_authority.py
            description: Exact caller/context authority and fail-closed boundary proof.
          - type: contract-test
            path: tests/conformance/test_events.py
            description: Exact canonical outcome-event envelope and payload conformance.
          - type: integration-test
            path: tests/integration/test_order_consequence_read_model.py
            description: PostgreSQL consequence projection persistence and tenant-scoped read proof.
          - type: integration-test
            path: tests/integration/test_order_to_cash_http.py
            description: Real HTTP and Postgres order-to-cash execution against an iDempiere transport fake.
          - type: integration-test
            path: tests/integration/test_http_server.py
            description: Canonical Trade order event ingress is authenticated, validated and deduplicated.
          - type: integration-test
            path: tests/integration/test_order_inbox_execution.py
            description: Replay, restart after an uncertain outcome, concurrent workers and adoption of an engine order created before a crash each leave exactly one sales order.
          - type: contract-test
            path: tests/conformance/test_order_execution.py
            description: Executed order publishes the registered order.consequence-changed event.
          - type: test
            path: tests/unit/test_order_event_policy.py
            description: Retry, backoff and outcome classification rules.

      - capability_key: inventory.availability.query
        contract_versions: [1]
        implementation_status: IMPLEMENTED
        provenance:
          authority:
            repository: baobab-platform/shared
          source_revision: 40d180756461f3fbbdcf06d1dcd3e1fe6481bed2
        implementation_evidence:
          - type: source
            path: modules/application/inventory_availability.py
            description: Canonical inventory query adapter with validation, mapping and fail-closed response behavior.
          - type: source
            path: modules/inventory/availability.py
            description: Live iDempiere physical stock reader and ERP availability calculation.
          - type: source
            path: modules/inventory/mappings.py
            description: Explicit tenant/legal-entity SKU and warehouse mapping authority used by the query.
          - type: source
            path: modules/application/boundary.py
            description: Canonical GET /inventory-availability route registration with caller-bound Control Plane context authority.
          - type: source
            path: modules/security/platform_context.py
            description: Fail-closed caller-bound Control Plane context validation used before inventory access.
          - type: contract-test
            path: tests/conformance/test_context_authority.py
            description: Exact caller/context authority and fail-closed boundary proof.
          - type: contract-test
            path: tests/conformance/test_http_contract.py
            description: Exact Shared ERP OpenAPI and response/error conformance for the boundary.
          - type: integration-test
            path: tests/integration/test_inventory_availability_handler.py
            description: Physical-stock query, mapping, error and unavailable-engine integration proof.
          - type: integration-test
            path: tests/integration/test_boundary_api.py
            description: Canonical authenticated ERP Boundary API routing and tenant-scoped behavior.
