schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "baobab-erp"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.4.3"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: false
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.python"
    - "languages.node"
    - "database.postgresql"
    - "package_managers.uv"
    - "development.docker"
    - "development.github_cli"
notes:
  - "PostgreSQL is now the ERP runtime database (iDempiere + Baobab-owned schema)."
  - "OSGi extension bundles require Java 17 and Maven; both are present in this session's base image, but baobab-dev's contract does not yet declare a languages.java capability. Track adding one under ADR-ERP-013 rather than assuming it silently."
