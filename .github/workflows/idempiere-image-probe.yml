name: iDempiere image probe

# Evidence only (no gate): which iDempiere base images carry a patched jackson-core in the
# Hazelcast service bundle. Used to choose between waiting for an upstream release and an
# ADR-ERP-004 section 5 mitigation. Remove once the base image is fixed.
on:
  pull_request:
    paths:
      - scripts/probe-idempiere-image.sh
      - .github/workflows/idempiere-image-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [13-release, 13-daily]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the Hazelcast bundle
        run: scripts/probe-idempiere-image.sh "idempiereofficial/idempiere:${{ matrix.tag }}" "probe-${{ matrix.tag }}"
      - name: Scan the image for the finding
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: idempiereofficial/idempiere:${{ matrix.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idempiere-probe-${{ matrix.tag }}
          path: probe-${{ matrix.tag }}/probe.txt
