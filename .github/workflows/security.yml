name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/security-secrets-scan.yml@317538bfa9cac7d0117420c12984d80d89d9f5ea # fix: scope gitleaks to checked-out ref (baobab-platform/shared#45)

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@6ddda104faecd4a5e43b3b1a4b85d1e62eb7991e # fix: explicit upload-sarif step (baobab-platform/shared#42)
    with:
      languages: '["python", "java"]'
