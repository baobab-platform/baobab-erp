name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
    uses: nabhold/shared/.github/workflows/security-secrets-scan.yml@29590cd01a5cf107f7cc5605b217bd6767e4ae2a # TEMP: testing fix/gitleaks-scope-to-checked-out-ref

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: nabhold/shared/.github/workflows/security-codeql.yml@6ddda104faecd4a5e43b3b1a4b85d1e62eb7991e # fix: explicit upload-sarif step (nabhold/shared#42)
    with:
      languages: '["python", "java"]'
