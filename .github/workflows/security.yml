name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/security-secrets-scan.yml@4ea2cbb5638a5605e057a02665bc7360864fc253 # fix: scope gitleaks to checked-out ref (baobab-platform/shared#45)

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@b9f497f247f1c19be9b02a0d5eedd538daf9d84b # fix: explicit upload-sarif step (baobab-platform/shared#42)
    with:
      languages: '["python", "java"]'
