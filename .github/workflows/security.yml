name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
    uses: nabhold/shared/.github/workflows/security-secrets-scan.yml@38defb11aacd95a6f68b7db8026fe336417a2af6 # v1.2.0

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: nabhold/shared/.github/workflows/security-codeql.yml@b7acc1e48806c6afc89419e56fdd74c54f467b2e # TEMP: testing fix/codeql-reusable-workflow-sarif-upload
    with:
      languages: '["python", "java"]'
