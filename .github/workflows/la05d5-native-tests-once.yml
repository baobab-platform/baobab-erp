name: LA-05D5 protected O2C unit suite
on:
  push:
    branches: [feat/la05d5-governed-o2c-native-paths]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  o2c-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      # P0-04A wire validators are runtime dependencies, not test stubs.
      - name: Install application runtime dependencies
        run: python -m pip install -e modules
      # BA-SEC-DEP-001 regression suite parses Dependabot YAML. This test-only
      # parser is deliberately pinned and not inserted into the ERP runtime.
      - name: Install pinned dependency-policy test parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - run: |
          python -m compileall -q modules tests
          PYTHONPATH=modules:tests/unit python -m unittest discover -s tests/unit -p 'test_*.py'
