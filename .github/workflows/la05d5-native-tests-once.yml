name: LA-05D5 protected O2C unit suite
on:
  push:
    branches: [feat/la05d5-governed-o2c-native-paths]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  o2c-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: "3.14"
      - run: |
          python -m compileall -q modules tests
          PYTHONPATH=modules:tests/unit python -m unittest discover -s tests/unit -p 'test_*.py'
