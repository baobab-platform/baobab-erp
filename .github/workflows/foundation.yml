name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@5d8445c858bcbfa538959dd5804c4c87e0bf906e
    with:
      foundation_ref: "5d8445c858bcbfa538959dd5804c4c87e0bf906e"
      dependency_review_enabled: true
      advanced_security_enabled: false
      legacy_metadata_enabled: false
