name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@39f4cd4753766bf8c9205ceb4edbca35ae70aabd
    with:
      foundation_ref: "39f4cd4753766bf8c9205ceb4edbca35ae70aabd"
      dependency_review_enabled: true
      advanced_security_enabled: false
      legacy_metadata_enabled: false
