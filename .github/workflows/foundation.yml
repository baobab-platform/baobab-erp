name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@468f0e6a8e8e4aac5ec37e87264a073752320530
    with:
      foundation_ref: "468f0e6a8e8e4aac5ec37e87264a073752320530"
      dependency_review_enabled: false
      advanced_security_enabled: false
      legacy_metadata_enabled: false
