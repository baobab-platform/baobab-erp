name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@b1e293716a3f3e45302948bd634ff816bc7e15e1
    with:
      foundation_ref: "b1e293716a3f3e45302948bd634ff816bc7e15e1"
      dependency_review_enabled: false
      advanced_security_enabled: false
      legacy_metadata_enabled: false
