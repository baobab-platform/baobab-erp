name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@53ed9cdba8fc33e2f184d1ba29b990f71b74f85f
    with:
      foundation_ref: "53ed9cdba8fc33e2f184d1ba29b990f71b74f85f"
      dependency_review_enabled: false
      advanced_security_enabled: false
      legacy_metadata_enabled: false
