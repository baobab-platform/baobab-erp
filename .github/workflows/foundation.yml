name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@ddd2c56f52b60472f0af1fd2e896e9cdd14bb636
    with:
      foundation_ref: "ddd2c56f52b60472f0af1fd2e896e9cdd14bb636"
      dependency_review_enabled: false
      advanced_security_enabled: false
      legacy_metadata_enabled: false
