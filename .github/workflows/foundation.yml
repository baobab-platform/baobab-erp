name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@047fa7e360c2d3d35eaabe863401b2d95b6a74cc
    with:
      dockerfile: "idempiere/Dockerfile"
      build_context: "."
      dependency_review_enabled: true
      legacy_metadata_enabled: false
