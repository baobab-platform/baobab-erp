name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Validate source and contracts in the Baobab environment
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp/baobab-home
          --volume "${GITHUB_WORKSPACE}:/workspace"
          --workdir /workspace
          --env SKIP_COMPOSE_VALIDATION=1
          --env PYTHONPYCACHEPREFIX=/tmp/baobab-pyc
          ghcr.io/baobab-platform/baobab-dev:1.4.4
          bash scripts/validate.sh

  compose-validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        env:
          DB_PASS: validation
          DB_ADMIN_PASS: validation
          BAOBAB_EVENT_SIGNING_SECRET: validation
          BAOBAB_WEBHOOK_URL: https://validation.example.com/baobab/events
          BAOBAB_IAM_OIDC_ISSUER: https://validation.example.com/realms/baobab
        run: docker compose -f compose.yaml config --quiet

  build-extensions:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Baobab OSGi extension bundles
        run: mvn -q -B -f idempiere/extensions package
      - name: Verify standalone shaded OSGi contract bundle
        run: python3 scripts/verify_contract_artifacts.py --jar idempiere/extensions/org.nabhold.baobab.erp.integration/target/org.nabhold.baobab.erp.integration-0.1.0.jar

  contract-wheel:
    # Prove production dependencies/resources from a real installed wheel,
    # without editable source or conformance extras masking missing packages.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up runtime Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: "3.12"
      - name: Build and install standalone wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/erp-wheel modules/
          python -m venv /tmp/erp-wheel-runtime
          /tmp/erp-wheel-runtime/bin/pip install /tmp/erp-wheel/*.whl
      - name: Verify packaged schema bytes and installed validators
        run: python scripts/verify_contract_artifacts.py --wheel /tmp/erp-wheel/*.whl --runtime-python /tmp/erp-wheel-runtime/bin/python

  native-finance-postgres:
    # EA v2.1 Gate B (P0-04B ERP): the real JVM placement, readiness, operation and
    # attribution providers and the native COMMIT fence, over JDBC on PostgreSQL.
    # The adempiere schema is a minimal fixture; this is not an iDempiere run (Gate D).
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baobab_native_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_native_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_native_test
      BAOBAB_NATIVE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/baobab_native_test?user=baobab&password=baobab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Create the minimal adempiere fixture schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/native/adempiere_fixture.sql
      - name: Apply application and native migrations
        run: ./db/migrate.sh && ./db/migrate-native.sh
      - name: Native migrations are idempotent
        run: ./db/migrate-native.sh
      - name: Gate B native finance providers and COMMIT fence on PostgreSQL
        run: >-
          mvn -q -B -f idempiere/extensions -pl org.nabhold.baobab.erp.finance -am test
          -Dtest=NativeFinancePostgresGateBTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Gate B must have run, not skipped
        run: >-
          grep -q 'tests="9"[^>]*skipped="0"'
          idempiere/extensions/org.nabhold.baobab.erp.finance/target/surefire-reports/TEST-org.nabhold.baobab.erp.finance.NativeFinancePostgresGateBTest.xml

  build-image:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build deployable ERP image
        run: docker build -f idempiere/Dockerfile -t baobab-erp:test .
      - name: Build deployable application-service image
        run: docker build -f modules/Dockerfile -t baobab-app:test .

  shared-conformance:
    name: Conformance against the pinned Shared contracts
    runs-on: ubuntu-26.04
    # EA-01 / ADR-SHARED-018 ERP-COMPAT-06: ERP's mapping documents, problem documents, events and live HTTP
    # responses are checked against the real files at the commit contracts.lock.yaml pins. The suite itself
    # asserts that the checkout is exactly that commit and never skips.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baobab_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_test
      BAOBAB_SHARED_PATH: ${{ github.workspace }}/.shared-contracts
      # The registration preflight refuses a Shared checkout with stray files, so nothing here may write bytecode into it.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned baobab-platform/shared commit
        id: pin
        run: echo "commit=$(grep -m1 'commit:' contracts.lock.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Checkout baobab-platform/shared at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install modules/ with the conformance extras
        run: pip install --break-system-packages -q -e "modules[conformance]"
      - name: Apply database migrations
        run: ./db/migrate.sh
      - name: Verify exact generated contract bundles
        run: python3 scripts/sync_authority_contracts.py --shared-checkout "$BAOBAB_SHARED_PATH" --check
      - name: Shared conformance
        run: PYTHONPATH=modules:tests/conformance python3 -m unittest discover -s tests/conformance -p 'test_*.py' -v
      - name: Provider registration preflight
        # ERP-CAP-07: the declaration validates at the pinned Shared commit and the DRAFT registrations it generates are the
        # IMPLEMENTED support only. Read-only; it registers and activates nothing (docs/operations/provider-support-publication.md).
        run: python3 scripts/provider_publication.py --shared-checkout "$BAOBAB_SHARED_PATH" --require-registrable

  integration:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baobab_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install modules/ with its Postgres driver
        run: pip install --break-system-packages -q -e modules
      - name: Apply database migrations
        run: ./db/migrate.sh
      - name: Run integration tests against real Postgres
        run: PYTHONPATH=modules python3 -m unittest discover -s tests/integration -p 'test_*.py' -v
