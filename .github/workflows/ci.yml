name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: DEV-09 native harness syntax and guarded evidence unit tests
        run: |
          python3 -m py_compile \
            idempiere/acceptance/erp-a/driver/ory_bootstrap.py \
            idempiere/acceptance/erp-a/driver/independent_company.py \
            idempiere/acceptance/erp-a/driver/restore_drill.py \
            idempiere/acceptance/erp-a/driver/seed.py \
            idempiere/acceptance/erp-a/driver/gate_d_erp_a.py \
            scripts/dev09_connected_evidence.py \
            tests/unit/test_dev09_connected_evidence.py
          bash -n idempiere/acceptance/erp-a/run-gate-d-erp-a.sh
          bash -n idempiere/acceptance/run-gate-d.sh
          python3 -m unittest discover -s tests/unit -p 'test_dev09_connected_evidence.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_dev12_restore.py' -v
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Validate source and contracts in the Baobab environment
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp/baobab-home
          --volume "${GITHUB_WORKSPACE}:/workspace"
          --workdir /workspace
          --env SKIP_COMPOSE_VALIDATION=1
          --env PYTHONPYCACHEPREFIX=/tmp/baobab-pyc
          ghcr.io/baobab-platform/baobab-dev:1.4.4
          bash scripts/validate.sh

  compose-validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        env:
          DB_PASS: validation
          DB_ADMIN_PASS: validation
          BAOBAB_EVENT_SIGNING_SECRET: validation
          BAOBAB_WEBHOOK_URL: https://validation.example.com/baobab/events
          BAOBAB_IAM_OIDC_ISSUER: https://validation.example.com/realms/baobab
        run: docker compose -f compose.yaml config --quiet
      - name: Validate actual DEV-09 ERP-A Hydra/Kratos Compose model
        # The main Compose model is not the ERP-A acceptance model: validate
        # both. These values are syntax-only and never start an issuer.
        env:
          RUN_DIR: /tmp/dev09-parse-only
          ERP_IMAGE: local/erp:parse-only
          CP_IMAGE: local/cp:parse-only
          PYTHON_IMAGE: local/py:parse-only
          CPDB_PASSWORD: parse-only
          ERP_WORKLOAD_SECRET: parse-only
          ORY_DB_PASSWORD: parse-only
          ORY_SYSTEM_SECRET: parse-only
          ORY_HOOK_SECRET: parse-only
        run: |
          # The PG user is expanded inside each independent service, not by
          # the Compose host (or all Ory stores become deceptively unhealthy).
          grep -Fq '$${POSTGRES_USER}' idempiere/acceptance/erp-a/compose.yaml
          docker compose -f idempiere/acceptance/erp-a/compose.yaml config --quiet

  build-extensions:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Baobab OSGi extension bundles
        run: mvn -q -B -f idempiere/extensions package
      - name: Verify standalone shaded OSGi contract bundle
        run: python3 scripts/verify_contract_artifacts.py --jar idempiere/extensions/org.nabhold.baobab.erp.integration/target/org.nabhold.baobab.erp.integration-0.1.0.jar

  contract-wheel:
    # Prove production dependencies/resources from a real installed wheel,
    # without editable source or conformance extras masking missing packages.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up runtime Python
        uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: "3.12"
      - name: Build and install standalone wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/erp-wheel modules/
          python -m venv /tmp/erp-wheel-runtime
          /tmp/erp-wheel-runtime/bin/pip install /tmp/erp-wheel/*.whl
      - name: Verify packaged schema bytes and installed validators
        run: python scripts/verify_contract_artifacts.py --wheel /tmp/erp-wheel/*.whl --runtime-python /tmp/erp-wheel-runtime/bin/python

  native-finance-postgres:
    # EA v2.1 Gate B (P0-04B ERP; ERP-A purchase side): the real JVM placement, readiness, operation and
    # attribution providers and the native COMMIT fence, over JDBC on PostgreSQL.
    # The adempiere schema is a minimal fixture; this is not an iDempiere run (Gate D).
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_native_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_native_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_native_test
      BAOBAB_NATIVE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/baobab_native_test?user=baobab&password=baobab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Create the minimal adempiere fixture schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/native/adempiere_fixture.sql
      - name: Apply application and native migrations
        run: ./db/migrate.sh && ./db/migrate-native.sh
      - name: Native migrations are idempotent
        run: ./db/migrate-native.sh
      - name: Gate B native finance providers and COMMIT fence on PostgreSQL
        run: >-
          mvn -q -B -f idempiere/extensions -pl org.nabhold.baobab.erp.finance -am test
          -Dtest=NativeFinancePostgresGateBTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Gate B must have run, not skipped
        run: >-
          grep -q 'tests="39"[^>]*skipped="0"'
          idempiere/extensions/org.nabhold.baobab.erp.finance/target/surefire-reports/TEST-org.nabhold.baobab.erp.finance.NativeFinancePostgresGateBTest.xml

  build-image:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build deployable ERP image
        run: docker build -f idempiere/Dockerfile -t baobab-erp:test .
      - name: Build deployable application-service image
        run: docker build -f modules/Dockerfile -t baobab-app:test .

  idempiere-posting-integration:
    name: Gate D — real iDempiere/PostgreSQL posting through the native finance veto
    # P0-04B ERP / ADR-ERP-022: the shipped image plus a CI-only driver layer posts real GL journals
    # on a fresh GardenWorld database against a synthetic CP over TLS, and asserts persisted state.
    # The only evidence on which "atomic posting verified" may be claimed. Never skipped.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java (keytool for the CI-generated truststore)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install PostgreSQL client
        run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - name: Build the deployable ERP image
        run: docker build -f idempiere/Dockerfile -t baobab-erp:test .
      - name: Add the CI-only Gate D driver layer (never shipped)
        run: >-
          docker build -f idempiere/acceptance/Dockerfile --build-arg BASE_IMAGE=baobab-erp:test
          -t baobab-erp:gate-d .
      - name: Gate D scenarios
        run: idempiere/acceptance/run-gate-d.sh baobab-erp:gate-d "$RUNNER_TEMP/gate-d"
      - name: Gate D evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-d-evidence
          path: |
            ${{ runner.temp }}/gate-d/gate-d-report.txt
            ${{ runner.temp }}/gate-d/idempiere.log
            ${{ runner.temp }}/gate-d/synthetic-cp.log
            ${{ runner.temp }}/gate-d/migrate.log
          if-no-files-found: error

  erp-a-real-cp:
    name: ERP-A engine-local harness — real iDempiere, real CP, signed workload tokens (not EA Gate D, not L4)
    # EA v2.2 EA-R03 / ADR-SHARED-037 / ADR-ERP-022 §4.3: the shipped image plus the CI-only driver layer
    # records the purchase side against the REAL CP release binary at a pinned merged commit, with real
    # RS256 workload tokens from a test issuer, PostgreSQL 17 for both, TLS on every hop. Asserts persisted
    # state in both databases and writes the v2.2 receipt. Engine-local evidence on synthetic data only:
    # never EA Gate D and never L4 (INT-01). Never skipped: fails unless "ERP-A failures: 0".
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # baobab-cp main after the ERP-A resolver (baobab-platform/baobab-cp#402).
      CP_COMMIT: 50a130576f6b126066a56e97a09676b2015f1261
      IAM_COMMIT: 0ad103606b9705fcb33c468ea01b54d8ce76f9ae
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out CP at the pinned merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/baobab-cp
          ref: ${{ env.CP_COMMIT }}
          path: .erp-a/cp
          persist-credentials: false
      - name: Check out IAM-owned Ory configs at a pinned merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/baobab-iam
          ref: ${{ env.IAM_COMMIT }}
          path: .erp-a/iam
          persist-credentials: false
      - name: Set up Go from CP's go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .erp-a/cp/go.mod
          cache: false
      - name: Set up Java (keytool for the run's truststore)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install PostgreSQL client
        run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - name: Build the deployable ERP image
        run: docker build -f idempiere/Dockerfile -t baobab-erp:test .
      - name: Add the CI-only driver layer (never shipped)
        run: >-
          docker build -f idempiere/acceptance/Dockerfile --build-arg BASE_IMAGE=baobab-erp:test
          -t baobab-erp:gate-d .
      - name: ERP-A scenarios
        env:
          BAOBAB_ENVIRONMENT: integration
          ERP_IMAGE: baobab-erp:gate-d
          CP_SRC: ${{ github.workspace }}/.erp-a/cp
          IAM_SRC: ${{ github.workspace }}/.erp-a/iam
          IAM_COMMIT: ${{ env.IAM_COMMIT }}
          EVIDENCE_LOCATION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (artifact erp-a-real-cp-evidence)
        run: idempiere/acceptance/erp-a/run-gate-d-erp-a.sh "$RUNNER_TEMP/erp-a"
      - name: Validate DEV-09 joined evidence parser
        run: python3 -m unittest discover -s tests/unit -p 'test_dev09_connected_evidence.py' -v
      - name: DEV-09 connected Ory/CP and second native-company component receipt
        run: |
          python3 scripts/dev09_connected_evidence.py \
            --directory "$RUNNER_TEMP/erp-a" \
            --erp-sha "${{ github.sha }}" \
            --cp-sha "$CP_COMMIT" --iam-sha "$IAM_COMMIT"
          test -s "$RUNNER_TEMP/erp-a/dev09-connected-report.sha256.json"
      - name: ERP-A report
        if: always()
        run: |
          cat "$RUNNER_TEMP/erp-a/erp-a-report.txt" || true
          grep -qx 'ERP-A failures: 0' "$RUNNER_TEMP/erp-a/erp-a-report.txt"
      - name: DEV-09 sanitised component receipt (complete native inventory and teardown required)
        run: >-
          python3 scripts/dev09_evidence.py report --directory "$RUNNER_TEMP/erp-a"
          --source-sha "${{ github.sha }}" --cp-sha "$CP_COMMIT"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: DEV-09 connected component receipt and original sanitised reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev09-erp-components
          path: |
            ${{ runner.temp }}/erp-a/dev09-report.json
            ${{ runner.temp }}/erp-a/dev09-report.sha256.json
            ${{ runner.temp }}/erp-a/dev09-connected-report.json
            ${{ runner.temp }}/erp-a/dev09-connected-report.sha256.json
            ${{ runner.temp }}/erp-a/dev12-native-restore.json
            ${{ runner.temp }}/erp-a/dev12-native-restore.sha256.json
          if-no-files-found: error
          retention-days: 30
      - name: ERP-A evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erp-a-real-cp-evidence
          path: ${{ runner.temp }}/erp-a
          retention-days: 30

  shared-conformance:
    name: Conformance against the pinned Shared contracts
    runs-on: ubuntu-26.04
    # EA-01 / ADR-SHARED-018 ERP-COMPAT-06: ERP's mapping documents, problem documents, events and live HTTP
    # responses are checked against the real files at the commit contracts.lock.yaml pins. The suite itself
    # asserts that the checkout is exactly that commit and never skips.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_test
      BAOBAB_SHARED_PATH: ${{ github.workspace }}/.shared-contracts
      # The registration preflight refuses a Shared checkout with stray files, so nothing here may write bytecode into it.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned baobab-platform/shared commit
        id: pin
        run: echo "commit=$(grep -m1 'commit:' contracts.lock.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Checkout baobab-platform/shared at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ steps.pin.outputs.commit }}
          path: .shared-contracts
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install modules/ with the conformance extras
        run: pip install --break-system-packages -q -e "modules[conformance]"
      - name: Apply database migrations
        run: ./db/migrate.sh
      - name: Verify exact generated contract bundles
        run: python3 scripts/sync_authority_contracts.py --shared-checkout "$BAOBAB_SHARED_PATH" --check
      - name: Shared conformance
        run: PYTHONPATH=modules:tests/conformance python3 -m unittest discover -s tests/conformance -p 'test_*.py' -v
      - name: Provider registration preflight
        # ERP-CAP-07: the declaration validates at the pinned Shared commit and the DRAFT registrations it generates are the
        # IMPLEMENTED support only. Read-only; it registers and activates nothing (docs/operations/provider-support-publication.md).
        run: python3 scripts/provider_publication.py --shared-checkout "$BAOBAB_SHARED_PATH" --require-registrable

  integration:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install modules/ with its Postgres driver
        run: pip install --break-system-packages -q -e modules
      - name: Apply database migrations
        run: ./db/migrate.sh
      - name: Run integration tests against real Postgres
        run: PYTHONPATH=modules python3 -m unittest discover -s tests/integration -p 'test_*.py' -v
