# DEV10-R3 owner-side JDK21/Maven3.10 + isolated Java21-bytecode probe.
# The *deployed* iDempiere runtime still targets Java17 classfiles; this CI
# never alters that shipping contract or qualifies Java21 runtime plugins.
name: DEV10 R3 Java21 ERP OSGi compatibility
on:
  pull_request:
    paths:
      - ".github/workflows/dev10-r3-java21.yml"
      - "idempiere/extensions/**"
      - "scripts/verify_contract_artifacts.py"
      - "scripts/verify_java21_bytecode_probe.py"
      - "modules/shared_contracts/data/**"
      - "tests/fixtures/authority-contract-cases.json"
      - "tests/native/adempiere_fixture.sql"
      - "db/migrations/**"
      - "db/migrate.sh"
      - "db/migrate-native.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dev10-r3-java21.yml"
      - "idempiere/extensions/**"
      - "scripts/verify_contract_artifacts.py"
      - "scripts/verify_java21_bytecode_probe.py"
      - "modules/shared_contracts/data/**"
      - "tests/fixtures/authority-contract-cases.json"
      - "tests/native/adempiere_fixture.sql"
      - "db/migrations/**"
      - "db/migrate.sh"
      - "db/migrate-native.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-osgi:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: idempiere/extensions/**/pom.xml
      - name: Install checksum-pinned Apache Maven 3.10.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            https://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
          echo "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa  $archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.10.0/bin/mvn" -version | grep -F 'Apache Maven 3.10.0'
      - name: Assert actual Java 21 compiler and Maven 3.10.0
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          mvn -version
          java -version 2>&1 | grep -E 'version "21\.|openjdk 21\.'
          javac -version 2>&1 | grep -E '^javac 21\.'
          mvn -version | grep -F 'Apache Maven 3.10.0'
      - name: Build and execute OSGi module tests with Java 21
        run: mvn --batch-mode --no-transfer-progress -f idempiere/extensions verify
      - name: Verify actual packaged integration JAR contracts
        run: >-
          python3 scripts/verify_contract_artifacts.py
          --jar idempiere/extensions/org.nabhold.baobab.erp.integration/target/org.nabhold.baobab.erp.integration-0.1.0.jar
      - name: Probe full OSGi reactor compiling Java 21 bytecode (non-deployable)
        run: >-
          mvn --batch-mode --no-transfer-progress -f idempiere/extensions
          clean verify -Dmaven.compiler.release=21
      - name: Assert all Baobab native classfiles target Java 21 major 65
        run: python3 scripts/verify_java21_bytecode_probe.py

  java21-native-finance:
    # Java 21 JDK + Maven 3.10 + source-target Java21 classfiles.
    # The OSGi reactor's 40 JDBC Gate B tests (39 historical plus F1 native readback) intentionally skip without
    # BAOBAB_NATIVE_TEST_JDBC_URL. Do not call the Java21 compatibility
    # proof complete based solely on the non-database build job above.
    # This is the REAL PostgreSQL 17 provider/COMMIT-fence fixture, not
    # the full iDempiere release-13 runtime or a protected posting approval.
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_native_test
          POSTGRES_USER: baobab
          POSTGRES_PASSWORD: baobab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab -d baobab_native_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://baobab:baobab@localhost:5432/baobab_native_test
      BAOBAB_NATIVE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/baobab_native_test?user=baobab&password=baobab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: idempiere/extensions/**/pom.xml
      - name: Install checksum-pinned Apache Maven 3.10.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            https://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
          echo "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa  $archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.10.0/bin/mvn" -version | grep -F 'Apache Maven 3.10.0'
      - name: Assert actual Java 21 execution
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | grep -E 'version "21\.|openjdk 21\.'
          javac -version 2>&1 | grep -E '^javac 21\.'
      - name: Create the native iDempiere table fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/native/adempiere_fixture.sql
      - name: Apply application and native migrations
        run: ./db/migrate.sh && ./db/migrate-native.sh
      - name: Assert native migrations are idempotent
        run: ./db/migrate-native.sh
      - name: Execute JVM finance posting fences on PostgreSQL 17
        run: >-
          mvn --batch-mode --no-transfer-progress -f idempiere/extensions
          -pl org.nabhold.baobab.erp.finance -am test
          -Dtest=NativeFinancePostgresGateBTest -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.compiler.release=21
      - name: Require all 40 native JDBC tests to execute, none skipped
        run: >-
          grep -q 'tests="40"[^>]*skipped="0"'
          idempiere/extensions/org.nabhold.baobab.erp.finance/target/surefire-reports/TEST-org.nabhold.baobab.erp.finance.NativeFinancePostgresGateBTest.xml
