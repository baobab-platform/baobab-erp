name: DEV-11 native ERP RabbitMQ signed inbox unit qualification

on:
  pull_request:
    paths:
      - .github/workflows/dev11-amqp-native.yml
      - modules/application/inbox_authority.py
      - modules/application/amqp_consumer.py
      - modules/application/observability.py
      - modules/application/inbox_worker.py
      - modules/inbox/service.py
      - modules/inbox/postgres_store.py
      - modules/inbox/postgres_queue.py
      - modules/pyproject.toml
      - tests/unit/test_dev11_amqp_consumer.py
      - tests/unit/test_dev11_operator_inbox_authority.py
      - scripts/dev11_verify_native_idempiere_order.py
      - scripts/dev11_verify_cp_native_lineage.py
      - tests/unit/test_dev11_native_order_verifier.py
      - tests/unit/test_dev11_cp_native_lineage.py
      - modules/integration/idempiere_gate_d_real.py
      - tests/unit/test_dev11_real_jvm_adapter.py
      - idempiere/acceptance/erp-a/driver/dev11_native_connected.py
      - idempiere/acceptance/driver/src/org/nabhold/baobab/erp/acceptance/SalesFlow.java
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-inbox-contract:
    name: Installed ERP wheel rejects forged AMQP and replayed business payloads
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (official signed release)
        with:
          python-version: "3.14"
      - name: Install real ERP runtime dependencies
        run: python -m pip install -e modules
      - name: Native AMQP canonical signature/replay/admission negatives
        env:
          PYTHONPATH: modules
        run: python -m unittest discover -s tests/unit -p test_dev11_amqp_consumer.py -v
      - name: Operator-owned event authority, immutable scope and live-provider preflight negatives
        env:
          PYTHONPATH: modules
        run: python -m unittest discover -s tests/unit -p test_dev11_operator_inbox_authority.py -v
      - name: Independent real-native PostgreSQL order verifier missing-effect and foreign-company negatives
        env:
          PYTHONPATH: modules
        run: python -m unittest discover -s tests/unit -p test_dev11_native_order_verifier.py -v
      - name: Real CP-to-JVM immutable authority decision provenance negatives
        env:
          PYTHONPATH: modules
        run: python -m unittest discover -s tests/unit -p test_dev11_cp_native_lineage.py -v
      - name: Real JVM protected test-only bridge and foreign company negatives
        env:
          PYTHONPATH: modules
        run: python -m unittest discover -s tests/unit -p test_dev11_real_jvm_adapter.py -v
      - name: Compile native ERP receiver, protected worker, real-engine verifier and connected scenario
        run: |
          python -m compileall -q modules/application modules/inbox modules/integration \
            scripts/dev11_verify_native_idempiere_order.py \
            scripts/dev11_verify_cp_native_lineage.py \
            idempiere/acceptance/erp-a/driver/dev11_native_connected.py
          bash -n idempiere/acceptance/erp-a/run-gate-d-erp-a.sh
